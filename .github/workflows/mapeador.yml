name: Mapeador - verificar e publicar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar ambiente Codex Cloud e validar o projeto
        run: bash scripts/cloud-setup.sh

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mapeador-apps-script-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publicar na implantação existente e conferir versão
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: npm run deploy
      - uses: actions/upload-artifact@v4
        with:
          name: mapeador-publicacao-${{ github.sha }}
          path: deployment-result.json
          retention-days: 30
