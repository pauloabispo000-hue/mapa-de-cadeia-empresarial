<body>
<div class="app">
  <aside class="rail">
    <div class="rail-top">
      <p class="eyebrow">Mapa Econômico Local</p>
      <h1 class="brand">Cadeias &amp; Redes</h1>
    <p class="tag">Questionário para empresários</p>
    </div>
    <ol class="steps" id="stepsList"></ol>
    <div class="map-wrap">
      <p class="map-label">Seu mapa de conexões</p>
      <svg id="liveMap" viewBox="0 0 260 460" xmlns="http://www.w3.org/2000/svg"></svg>
      <p class="map-hint">Cresce conforme você responde</p>
    </div>
  </aside>

  <main class="content">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

      <button id="btnBack" class="btn btn-ghost">Voltar</button>
      <button id="btnNext" class="btn btn-primary">Continuar</button>
    </div>
  </main>
</div>

<script>
(function(){
"use strict";

/* ============================= CONSTANTES ============================= */
var PERFIL_CLIENTES_OPTS = ["Consumidor final","Empresas","Comércio","Indústria","Prestadores de serviço","Órgãos públicos","Outros"];
var ABRANGENCIA_OPTS = ["Mesmo município","Região","Estado","Outros estados","Exterior"];
var LOCALIZACAO_OPTS = ["Mesmo município","Região","Estado","Outro estado","Exterior"];
var MODELO_NEGOCIO_OPTS = ["Profissional liberal autônomo","Negócio próprio (não franqueado)","Matriz","Filial","Franquia (franqueador)","Franquia (franqueado)","Cooperativa","MEI","Outro"];

var NICHO_PROFISSIONAL_LIBERAL_OPTS = ["Dentista","Esteticista","Massagista","Acupunturista","Fisioterapeuta",
  "Médico(a)","Veterinário(a)","Psicólogo(a)","Nutricionista","Advogado(a)","Contador(a)","Arquiteto(a)",
  "Engenheiro(a)","Consultor(a)","Corretor(a) de imóveis","Cabeleireiro(a)","Manicure/Pedicure","Tatuador(a)",
  "Personal trainer","Fotógrafo(a)","Professor(a) particular","Terapeuta holístico(a)","Fonoaudiólogo(a)",
  "Designer gráfico(a)","Costureiro(a)/Modista","Eletricista autônomo(a)","Encanador(a) autônomo(a)",
  "Pintor(a) autônomo(a)","Diarista/Faxineiro(a)","Motorista autônomo(a)","Outro"];

var NICHO_FRANQUIA_OPTS = ["Alimentação (lanchonete, fast-food, cafeteria)","Padaria e confeitaria","Beleza e estética",
  "Academia e bem-estar","Educação e idiomas","Moda e vestuário","Calçados","Saúde (clínicas, farmácias)",
  "Serviços automotivos","Limpeza e conservação","Tecnologia e informática","Papelaria e conveniência",
  "Pet shop e veterinária","Imobiliária","Contabilidade e serviços financeiros","Turismo e viagens",
  "Móveis e decoração","Varejo em geral","Outro"];

var NICHO_COOPERATIVA_OPTS = ["Agropecuária","Crédito","Saúde","Trabalho e produção","Educacional",
  "Habitacional","Consumo","Transporte","Artesanato","Outro"];

// Para os modelos abaixo, o nicho é o próprio segmento de atuação do negócio (lista já usada em Segmento)
var MODELOS_QUE_USAM_SEGMENTOS = ["Negócio próprio (não franqueado)","Matriz","Filial","MEI"];

/* ===== Doze Áreas de Necessidades Fundamentais Universais =====
   Baseado na teoria da "Cadeia de Interdependência" (Paulo Bispo, 2025): toda atividade
   econômica se enquadra em uma (ou mais) destas 12 áreas, que dependem umas das outras para
   sustentar o sistema. Descrições resumidas em linguagem simples, para uso no formulário. */
var AREAS_12 = [
  {num:1, nome:"Energias/Combustíveis", desc:"Geração, distribuição e uso de energia e combustíveis — elétrica, solar, eólica, gás, petróleo e derivados."},
  {num:2, nome:"Transportes/Logísticas", desc:"Transporte de pessoas e cargas, embalagens, estoque, distrib…55990 tokens truncated…&&old.id ? old.id : id;
  entity.empresa=name;
  return entity;
}
function syncConversationAnswers(){
  var a=state.answers, b=state.business;
  b.nome=a.negocioNome.trim(); b.cnpj=String(a.cnpj||"").replace(/\D/g,""); b.pais=a.pais||"Brasil"; b.cidade=a.cidade.trim();
  var selecionados=a.produtosSelecionados||[];
  b.produtoDetalhe=a.produtos.trim();
  b.segmento=selecionados[0]||"Outro"; b.segmentoOutro=a.produtos.trim();
  b.produtoCategorias=selecionados.slice();
  b.perfilClientes=Array.isArray(a.tipoClientes)?a.tipoClientes.slice():[];
  b.areaNecessidade=selecionados.map(function(s){return SEGMENTO_AREA[s]||inferAreaFromText(s);}).filter(Boolean)[0]||inferAreaFromText(a.produtos);
  a.produtosClassificados=selecionados.map(function(item){return {item:item,area:SEGMENTO_AREA[item]||inferAreaFromText(item)||"Não identificado automaticamente"};});
  if(a.produtos.trim()) a.produtosClassificados.push({item:a.produtos.trim(),area:inferAreaFromText(a.produtos)||"Não identificado automaticamente"});
  var area=b.areaNecessidade;
  if(!b.produtoCategorias.length && a.produtos.trim()) b.produtoCategorias=["Outro"];
  var compras=(a.comprasSelecionadas||[]).slice();
  var comprasTexto=compras.concat(a.comprasFornecedores?[a.comprasFornecedores]:[]).join(", ");
  var selectedCompanyNames=(a.fornecedoresSelecionados||[]).map(function(value){
    var match=sharedCompanies.filter(function(company){return companyOptionLabel(company)===value;})[0];
    return match ? match.name : value;
  });
  var supplierNames=splitNames(a.fornecedores).concat(selectedCompanyNames).filter(function(name,i,all){return all.map(normName).indexOf(normName(name))===i;});
  state.fornecedores.lista=supplierNames.map(function(name,i){
    var e=reuseEntity("fornecedores",name,"supplier"+i); if(comprasTexto) e.itens=comprasTexto;
    e.categorias=compras.slice();
    var inferred=compras.map(function(item){return CATEGORIA_INSUMO_AREA[item];}).filter(Boolean)[0]||inferAreaFromText(comprasTexto); if(inferred) e.areaNecessidade=inferred;
    var known=sharedCompanies.filter(function(company){return normName(company.name)===normName(name)||company.aliases.some(function(alias){return normName(alias)===normName(name);});})[0];
    if(known){e.cnpj=known.cnpj||e.cnpj;e.cidade=known.city||e.cidade;e.empresa=known.name;if(known.areas.length)e.areaNecessidade=known.areas[0];}
    e.compra_de=true; return e;
  });
  state.clientes.lista=splitNames(a.clientes).map(function(name,i){
    var e=reuseEntity("clientes",name,"customer"+i); if(a.usoOferta) e.comoUtiliza=a.usoOferta; e.categorias=(a.categoriasClientes||[]).slice(); e.usa_minha_oferta=true; return e;
  });
  var nomesComplementares=splitNames(a.complementares);
  var nomesIndicacao=splitNames(a.indicacoes);
  state.complementares.lista=nomesComplementares.map(function(name,i){
    var e=reuseEntity("complementares",name,"complementary"+i); e.clientes_em_comum=true; return e;
  });
  nomesIndicacao.forEach(function(name,i){
    var e=reuseEntity("complementares",name,"referral"+i); e.indico=true; e.meIndica=true;
    if(!state.complementares.lista.some(function(x){return normName(x.empresa)===normName(name);})) state.complementares.lista.push(e);
  });
  state.complementares.negociosQueClientesProcuramCategorias=(a.complementaresSelecionados||[]).slice();
  state.complementares.outrosProdutosClientesPrecisamDetalhe=a.complementares;
  state.complementares.indicaQuandoNaoTem=a.indicacoes ? "Sim" : "";
  state.complementares.jaFezVendaConjunta=a.vendaConjunta ? (normalizeSearch(a.vendaConjunta)==="nao" ? "Não" : "Sim") : "";
  state.oportunidades.buscaForaMunicipioCategorias=(a.faltaLocalSelecionado||[]).slice();
  state.oportunidades.parceirosDesejadosCategorias=(a.oportunidadeSelecionada||[]).slice();
}

function renderConversationReview(container){
  if(state.meta.submittedAt){
    container.appendChild(h("div",{class:"success-box"},[
      h("h2",{},["Pronto, suas respostas foram enviadas."]),
      h("p",{},["Obrigado por ajudar a mostrar como os negócios se conectam na sua cidade."])
    ]));
  } else {
    container.appendChild(h("div",{class:"question-card"},[
      h("h2",{},["Confira suas respostas"]),
      h("p",{class:"question-help"},["Você pode voltar para ajustar qualquer resposta antes de enviar."])
    ]));
    if(state.meta.sendStatus==="error") container.appendChild(h("p",{class:"error-msg show"},[state.meta.sendError]));
    conversationQuestions.forEach(function(q){
      var answer=String(state.answers[q.key]||"").trim();
      if(answer) container.appendChild(h("div",{class:"review-row"},[
        h("div",{class:"rk"},[q.prompt]),h("div",{class:"rv"},[answer])
      ]));
    });
    var disclosure=h("div",{class:"conditional show",style:"margin-top:18px;"},[
      h("p",{style:"margin:0 0 10px;font-size:13px;"},["Suas respostas completas ajudam a atualizar o mapa e a encontrar conexões entre fornecedores e clientes. A lista sugerida a outros participantes contém somente nomes e identificadores de empresas, sem revelar quem compra de quem."]),
      h("label",{style:"display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer;"},[])
    ]);
    var consentLabel=disclosure.querySelector("label");
    var consentInput=h("input",{type:"checkbox",style:"margin-top:3px;"}); consentInput.checked=!!state.meta.shareDirectory;
    consentInput.addEventListener("change",function(){state.meta.shareDirectory=consentInput.checked;saveState();});
    consentLabel.appendChild(consentInput);
    consentLabel.appendChild(document.createTextNode("Autorizo que o nome e o CNPJ do meu negócio e das empresas que informei sejam usados como sugestões para outros participantes. Posso deixar desmarcado; minhas respostas ainda ajudam a análise agregada da rede."));
    container.appendChild(disclosure);
    if(sharedNetwork){
      var missing=(sharedNetwork.areas||[]).filter(function(area){return !area.knownSupplierLinks;}).map(function(area){return area.name;});
      container.appendChild(h("div",{class:"review-section",style:"margin-top:16px;"},[
        h("h3",{},["Rede colaborativa até agora"]),
        h("p",{class:"question-help"},[(sharedNetwork.companies||0)+" empresas identificadas e "+(sharedNetwork.relationships||0)+" relações registradas. A base encontrou "+(sharedNetwork.twoStepChains||0)+" cadeias com duas conexões; "+(sharedNetwork.confirmedClosures||0)+" já têm também a ligação direta registrada e "+(sharedNetwork.potentialConnections||0)+" são oportunidades para investigar com os participantes. Áreas sem fornecedor identificado: "+(missing.length?missing.join("; "):"nenhuma na base atual. A cobertura registrada não significa que todas as relações estejam confirmadas.")])
      ]));
    }
  }
  var exp=h("div",{class:"export-row"});
  exp.appendChild(h("button",{class:"btn-outline",type:"button",onclick:function(){
    downloadFile("mapeamento_"+(state.business.nome||"negocio").replace(/\s+/g,"_")+".json",JSON.stringify(buildExportObject(),null,2),"application/json");
  }},["Baixar cópia"]));
  container.appendChild(exp);
}

function optionsWithContributions(key, options){
  var additions=(state.contributedOptions||{})[key]||[];
  return (options||[]).concat(additions.filter(function(value){return (options||[]).indexOf(value)===-1;}));
}
function companyOptionLabel(company){
  var cnpj=String(company.cnpj||"").replace(/\D/g,"");
  return company.name+(cnpj?" — CNPJ "+formatarCNPJ(cnpj):"")+(company.city?" · "+company.city:"");
}
function sharedCompanyOptions(){ return sharedCompanies.map(companyOptionLabel); }
function addAnswerControl(key){
  var box=h("div",{class:"add-answer-box"});
  var open=h("button",{type:"button",class:"btn-outline add-answer-open"},["＋ Adicionar resposta"]);
  var form=h("div",{class:"add-answer-form"}); form.style.display="none";
  var input=h("input",{type:"text",class:"add-answer-input",placeholder:key.indexOf("cidade:")===0?"Digite o nome da cidade":"Digite uma opção que está faltando"});
  var save=h("button",{type:"button",class:"btn-primary add-answer-save"},["Salvar resposta"]);
  var message=h("p",{class:"add-answer-message"});
  open.addEventListener("click",function(){form.style.display="flex";open.style.display="none";input.focus();});
  save.addEventListener("click",function(){
    var value=input.value.trim();
    if(!value){message.textContent="Digite uma resposta.";return;}
    if(key.indexOf("cidade:")===0){
      var uf=key.slice(7);
      if(uf!=="*" && !/\s-\s[A-Z]{2}$/.test(value)) value += " - "+uf;
    }
    var options=optionsWithContributions(key,[]);
    if(options.some(function(item){return normalizeSearch(item)===normalizeSearch(value);})){message.textContent="Essa resposta já está na lista.";return;}
    state.contributedOptions=state.contributedOptions||{};
    state.contributedOptions[key]=state.contributedOptions[key]||[];
    state.contributedOptions[key].push(value);
    state.contributions=state.contributions||[];
    var contribution={id:uid(),field:key,value:value,createdAt:new Date().toISOString(),area:inferAreaFromText(value)||""};
    state.contributions.push(contribution);
    if(key==="produtosSelecionados"||key==="categoriasClientes"||key==="complementaresSelecionados"||key==="faltaLocalSelecionado"||key==="oportunidadeSelecionada"){
      if(contribution.area) SEGMENTO_AREA[value]=contribution.area;
    }
    if(key==="comprasSelecionadas"&&contribution.area) CATEGORIA_INSUMO_AREA[value]=contribution.area;
    if(key.indexOf("cidade:")===0) state.answers.cidade=value;
    else if(Array.isArray(state.answers[key])) state.answers[key].push(value);
    else if(Object.prototype.hasOwnProperty.call(state.answers,key)) state.answers[key]=value;
    syncConversationAnswers();
    saveState();
    renderCurrentStep();
  });
  form.appendChild(input);form.appendChild(save);form.appendChild(message);
  box.appendChild(open);box.appendChild(form);
  return box;
}

function renderConversation(container){
  syncConversationAnswers();
  var q=conversationQuestions[currentStepIndex];
  if(!q){ renderConversationReview(container); return; }
  container.appendChild(h("div",{class:"question-card"},[
    h("h2",{},[q.prompt]),
    q.help ? h("p",{class:"question-help"},[q.help]) : null,
    (function(){
      if(q.kind==="multi"){
        var multiOptions=optionsWithContributions(q.key,q.options);
        var multiField=buildComboMulti({options:multiOptions,selectedArr:state.answers[q.key],placeholder:"Escolha uma ou mais opções...",allowFreeText:false,onChange:function(){syncConversationAnswers();saveState();}});
        multiField.appendChild(addAnswerControl(q.key));
        return multiField;
      }
      if(q.kind==="companies"){
        var companyWrap=h("div",{});
        companyWrap.appendChild(buildComboMulti({options:sharedCompanyOptions(),selectedArr:state.answers[q.key],placeholder:"Buscar ou digitar o nome de uma empresa...",allowFreeText:true,onChange:function(){syncConversationAnswers();saveState();renderCurrentStep();}}));
        state.fornecedores.lista.forEach(function(entity){
          var supplierCard=h("div",{class:"subfield"});
          supplierCard.appendChild(h("label",{class:"small"},[entity.empresa+" — CNPJ opcional"]));
          supplierCard.appendChild(buildCNPJField({
            value:entity.cnpj,
            dadosCache:entity.cnpjDados,
            onDigitsChange:function(digits){entity.cnpj=digits;saveState();},
            onDadosChange:function(data){entity.cnpjDados=data;saveState();},
            onUseData:function(data){
              if(data.nomeFantasia||data.razaoSocial) entity.empresa=data.nomeFantasia||data.razaoSocial;
              if(data.municipio&&data.uf) entity.cidade=data.municipio+" - "+data.uf;
              saveState();renderCurrentStep();
            }
          }));
          companyWrap.appendChild(supplierCard);
        });
        return companyWrap;
      }
      if(q.kind==="cnpj"){
        return buildCNPJField({
          value:state.answers.cnpj,
          dadosCache:state.business.cnpjDados,
          onDigitsChange:function(digits){state.answers.cnpj=digits;state.business.cnpj=digits;saveState();},
          onDadosChange:function(data){state.business.cnpjDados=data;saveState();},
          onUseData:function(data){
            if(data.nomeFantasia||data.razaoSocial){state.answers.negocioNome=data.nomeFantasia||data.razaoSocial;state.business.nome=state.answers.negocioNome;}
            if(data.municipio&&data.uf){state.answers.cidade=data.municipio+" - "+data.uf;state.business.cidade=state.answers.cidade;}
            syncConversationAnswers();saveState();renderCurrentStep();
          }
        });
      }
      if(q.kind==="dropdown"){
        var options=q.options;
        if(q.key==="estado" && state.answers.pais!=="Brasil") options=["Não se aplica"];
        options=optionsWithContributions(q.key,options);
        var dropdownWrap=h("div",{});
        dropdownWrap.appendChild(comboField(options,state.answers[q.key],q.placeholder||"Escolha uma opção...",function(v){
          state.answers[q.key]=v;
          if(q.key==="pais" && v!=="Brasil"){state.answers.estado="";state.answers.cidade="";}
          if(q.key==="estado") state.answers.cidade="";
          syncConversationAnswers();saveState();
        }));
        dropdownWrap.appendChild(addAnswerControl(q.key));
        return dropdownWrap;
      }
      if(q.kind==="city"){
        if(state.answers.pais!=="Brasil") return textInput(state.answers.cidade,"Digite o nome da cidade",function(v){state.answers.cidade=v;syncConversationAnswers();saveState();});
        var uf=String(state.answers.estado||"").slice(-2);
        var cityKey="cidade:"+(uf||"*");
        var cities=uf ? CIDADES_BRASIL.filter(function(city){return city.slice(-2)===uf;}) : CIDADES_BRASIL;
        cities=optionsWithContributions(cityKey,cities);
        var cityWrap=h("div",{});cityWrap.appendChild(comboField(cities,state.answers.cidade,q.placeholder,function(v){state.answers.cidade=v;syncConversationAnswers();saveState();}));cityWrap.appendChild(addAnswerControl(cityKey));return cityWrap;
      }
      return q.multiline ? textArea(state.answers[q.key],q.placeholder,function(v){state.answers[q.key]=v;syncConversationAnswers();saveState();}) : textInput(state.answers[q.key],q.placeholder,function(v){state.answers[q.key]=v;syncConversationAnswers();saveState();});
    })()
  ].filter(Boolean)));
}

var RENDERERS = {
  apresentacao: renderApresentacao,
  identificacao: renderIdentificacao,
  fornecedores: renderFornecedores,
  clientes: renderClientes,
  complementares: renderComplementares,
  oportunidades: renderOportunidades,
  revisao: renderRevisao
};

function validateCurrentStep(){
  var key = STEPS[currentStepIndex].key;
  var errorEl = document.getElementById("errorMsg");
  errorEl.classList.remove("show");
  if(key==="identificacao"){
    if(!state.business.nome.trim()){
      errorEl.textContent = "Por favor, informe o nome do negócio antes de continuar.";
      errorEl.classList.add("show");
      return false;
    }
    if(state.business.produtoCategorias.length===0 && !state.business.produtoDetalhe.trim()){
      errorEl.textContent = "Por favor, selecione ao menos um produto/serviço (ou descreva no campo de detalhe) antes de continuar.";
      errorEl.classList.add("show");
      return false;
    }
    if(!state.business.cidade.trim()){
      errorEl.textContent = "Por favor, informe a cidade onde o negócio está estabelecido antes de continuar.";
      errorEl.classList.add("show");
      return false;
    }
    if(!state.business.areaNecessidade){
      errorEl.textContent = "Por favor, selecione a Área de Necessidade Fundamental do seu negócio antes de continuar.";
      errorEl.classList.add("show");
      return false;
    }
  }
  return true;
}

function renderStepsList(){
  var ol = document.getElementById("stepsList");
  ol.innerHTML = "";
  STEPS.forEach(function(s, i){
    var li = h("li",{class: i===currentStepIndex ? "active" : (i<currentStepIndex ? "done" : "")});
    li.appendChild(h("span",{class:"num"},[i<currentStepIndex ? "✓" : String(i+1)]));
    li.appendChild(document.createTextNode(s.label));
    li.addEventListener("click", function(){
      if(i <= currentStepIndex || validateCurrentStep()){
        currentStepIndex = i; renderCurrentStep(true);
      }
    });
    ol.appendChild(li);
  });
}

function renderCurrentStep(isStepChange){
  // Guarda a posição de rolagem para restaurá-la quando NÃO for uma troca real de etapa
  // (ex: escolher uma opção num dropdown, marcar um chip, adicionar/remover um item).
  var scrollY = window.scrollY || window.pageYOffset;

  stepContentEl.innerHTML = "";
  var total=conversationQuestions.length+1;
  var isReview=currentStepIndex>=conversationQuestions.length;
  renderConversation(stepContentEl);
  document.getElementById("progressFill").style.width = (Math.min(currentStepIndex,total-1)/(total-1)*100)+"%";

  var backBtn = document.getElementById("btnBack");
  var nextBtn = document.getElementById("btnNext");
  backBtn.disabled = currentStepIndex===0;

  if(isReview){
    if(state.meta.sendStatus==="sending"){ nextBtn.textContent = "Enviando…"; nextBtn.disabled = true; }
    else if(state.meta.submittedAt){ nextBtn.textContent = "Enviado ✓"; nextBtn.disabled = true; }
    else if(state.meta.sendStatus==="error"){ nextBtn.textContent = "Tentar novamente"; nextBtn.disabled = false; }
    else { nextBtn.textContent = "Confirmar e enviar"; nextBtn.disabled = false; }
  } else {
    nextBtn.textContent = "Continuar";
    nextBtn.disabled = false;
  }
  document.getElementById("errorMsg").classList.remove("show");
  renderMap();

  if(isStepChange){
    window.scrollTo(0,0);
  } else {
    window.scrollTo(0, scrollY);
  }
}

document.getElementById("btnNext").addEventListener("click", function(){
  if(currentStepIndex>=conversationQuestions.length){
    if(state.meta.sendStatus==="sending") return;
    state.meta.sendStatus = "sending";
    state.meta.sendError = "";
    renderCurrentStep();
    var payload = buildExportObject();
    sendToSheet(payload).then(function(){
      state.meta.submittedAt = new Date().toISOString();
      state.meta.sendStatus = "ok";
      saveState();
      renderCurrentStep();
    }).catch(function(err){
      state.meta.sendStatus = "error";
      state.meta.sendError = "Não foi possível enviar automaticamente (sem internet ou bloqueio de rede). Baixe o JSON ou o CSV abaixo e envie manualmente, ou tente novamente.";
      saveState();
      renderCurrentStep();
    });
    return;
  }
  if(currentStepIndex < conversationQuestions.length){
    var requiredKey=conversationQuestions[currentStepIndex].key;
    var requiredMessage={negocioNome:"Digite o nome do seu negócio para continuar.",cidade:"Escolha ou digite a cidade onde seu negócio funciona para continuar."}[requiredKey];
    if(requiredKey==="estado" && state.answers.pais==="Brasil" && !state.answers.estado) requiredMessage="Escolha o estado onde seu negócio funciona para continuar.";
    if(requiredKey==="produtos" && !(state.answers.produtosSelecionados||[]).length && !String(state.answers.produtos||"").trim()) requiredMessage="Escolha ao menos uma opção ou descreva um produto ou serviço.";
    if(requiredMessage && !String(state.answers[requiredKey]||"").trim()){
      var errorEl=document.getElementById("errorMsg"); errorEl.textContent=requiredMessage; errorEl.classList.add("show"); return;
    }
    syncConversationAnswers();
    saveState();
    currentStepIndex++;
    renderCurrentStep(true);
  }
});
document.getElementById("btnBack").addEventListener("click", function(){
  if(currentStepIndex>0){ currentStepIndex--; renderCurrentStep(true); }
});

/* ============================= MAPA VIVO (SVG) ============================= */
function truncate(s, n){ s = s||""; return s.length>n ? s.slice(0,n-1)+"…" : s; }

function renderMap(){
  var svg = document.getElementById("liveMap");
  var W=260, H=460, cx=130, cy=230;
  var parts = [];

  function line(x1,y1,x2,y2,color,dashed){
    parts.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="1.4" '+(dashed?'stroke-dasharray="3,3"':'')+' opacity="0.8"/>');
  }
  function node(x,y,r,fill,stroke){
    parts.push('<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.2"/>');
  }
  function label(x,y,text,size,color,anchor){
    parts.push('<text x="'+x+'" y="'+y+'" font-size="'+size+'" fill="'+color+'" text-anchor="'+(anchor||"middle")+'" font-family="Arial, sans-serif">'+escapeXML(text)+'</text>');
  }
  function escapeXML(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  var suppliers = state.fornecedores.lista.filter(function(e){return e.empresa.trim();}).slice(0,5);
  var supMore = state.fornecedores.lista.filter(function(e){return e.empresa.trim();}).length - suppliers.length;
  var customers = state.clientes.lista.filter(function(e){return e.empresa.trim();}).slice(0,5);
  var custMore = state.clientes.lista.filter(function(e){return e.empresa.trim();}).length - customers.length;
  var comp = state.complementares.lista.filter(function(e){return e.empresa.trim();}).slice(0,4);
  var compMore = state.complementares.lista.filter(function(e){return e.empresa.trim();}).length - comp.length;

  // center node
  node(cx,cy,32,"#E1962F","#B87418");
  label(cx,cy+4,truncate(state.business.nome||"Seu negócio",12),11,"#3A2600");

  // suppliers (top)
  var topY0 = 40, topY1 = 150;
  suppliers.forEach(function(s,i){
    var y = suppliers.length>1 ? topY0 + (topY1-topY0)*(i/(suppliers.length-1)) : (topY0+topY1)/2;
    var x = 70 + (i%2)*120;
    line(x,y,cx,cy,"#CFE3DF",false);
    node(x,y,11,"#0E5450","#EFF6F3");
    label(x,y-16,truncate(s.empresa,10),9,"#0A3E3B");
  });
  if(suppliers.length===0){
    parts.push('<circle cx="130" cy="95" r="11" fill="none" stroke="#CFE3DF" stroke-width="1.2" stroke-dasharray="2,2"/>');
    label(130,99,"+","12","#CFE3DF");
  }
  if(supMore>0){ label(130,25,"+"+supMore+" fornecedores",9,"#CFE3DF"); }
  label(130,20,"Fornecedores",9,"#9FC4BD");

  // customers (bottom)
  var botY0 = 320, botY1 = 430;
  customers.forEach(function(c,i){
    var y = customers.length>1 ? botY0 + (botY1-botY0)*(i/(customers.length-1)) : (botY0+botY1)/2;
    var x = 70 + (i%2)*120;
    line(x,y,cx,cy,"#CFE3DF",false);
    node(x,y,11,"#0E5450","#EFF6F3");
    label(x,y+20,truncate(c.empresa,10),9,"#0A3E3B");
  });
  if(customers.length===0){
    parts.push('<circle cx="130" cy="375" r="11" fill="none" stroke="#CFE3DF" stroke-width="1.2" stroke-dasharray="2,2"/>');
    label(130,379,"+","12","#CFE3DF");
  }
  if(custMore>0){ label(130,452,"+"+custMore+" clientes",9,"#CFE3DF"); }
  label(130,448,"Clientes",9,"#9FC4BD");

  // complementares (sides, dashed amber)
  var sideY0 = 170, sideY1 = 300;
  comp.forEach(function(cItem,i){
    var y = comp.length>1 ? sideY0 + (sideY1-sideY0)*(i/(comp.length-1)) : (sideY0+sideY1)/2;
    var x = i%2===0 ? 26 : 234;
    line(x,y,cx,cy,"#E1962F",true);
    node(x,y,9,"#F6DFB6","#B87418");
    label(x, i%2===0? y-14 : y-14, truncate(cItem.empresa,9),8.5,"#B87418", i%2===0?"start":"end");
  });
  if(compMore>0){ label(130,240,"+"+compMore+" complementares",8.5,"#F6DFB6"); }

  svg.innerHTML = parts.join("");
}

/* Fecha qualquer dropdown de busca aberto ao clicar fora dele — um único listener
   delegado, em vez de um por instância (evita acúmulo de listeners a cada re-render). */
document.addEventListener("click", function(evt){
  document.querySelectorAll("details.combo[open]").forEach(function(d){
    if(!d.contains(evt.target)) d.removeAttribute("open");
  });
});

renderCurrentStep(true);
loadSharedOptions();
})();
