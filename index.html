<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa do seu negócio — Questionário</title>
<style>
  :root{
    --ink:#1C2B28;
    --ink-soft:#425853;
    --paper:#FAF6EC;
    --paper-2:#F1EAD7;
    --paper-3:#E9E0C8;
    --teal:#0E5450;
    --teal-dark:#0A3E3B;
    --teal-soft:#C9DEDA;
    --amber:#E1962F;
    --amber-dark:#B87418;
    --amber-soft:#F6DFB6;
    --line:#D8CDB3;
    --good:#3F7554;
    --danger:#A5432F;
    --radius:14px;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--teal-dark);margin:0 0 .3em 0;}
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:11px;
    font-weight:700;
    color:var(--amber-dark);
    margin:0 0 6px 0;
  }
  a{color:var(--teal);}
  button{font-family:inherit;}
  .app{
    display:flex;
    min-height:100vh;
    max-width:1200px;
    margin:0 auto;
  }
  /* ---- Rail ---- */
  .rail{
    width:300px;
    flex:0 0 300px;
    background:linear-gradient(180deg,var(--teal-dark),var(--teal) 70%);
    color:#EFF6F3;
    padding:32px 26px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .rail-top .eyebrow{color:var(--amber-soft);}
  .rail-top .brand{font-family:var(--serif);font-size:26px;color:#fff;letter-spacing:.01em;margin:0;}
  .rail-top p.tag{font-size:13px;color:#CFE3DF;margin-top:8px;}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .steps li{
    display:flex;align-items:center;gap:10px;
    font-size:13.5px;color:#BFDAD4;
    padding:8px 0;
    border-left:2px solid rgba(255,255,255,.15);
    padding-left:14px;
    cursor:pointer;
    transition:color .15s ease;
  }
  .steps li .num{
    width:20px;height:20px;flex:0 0 20px;
    border-radius:50%;
    border:1.5px solid #BFDAD4;
    display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:700;
  }
  .steps li.active{color:#fff;border-left-color:var(--amber);font-weight:700;}
  .steps li.active .num{background:var(--amber);border-color:var(--amber);color:var(--teal-dark);}
  .steps li.done .num{background:#fff;border-color:#fff;color:var(--teal-dark);}
  .steps li.done{color:#EFF6F3;}
  .map-wrap{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.18);}
  .map-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:#CFE3DF;margin:0 0 6px 0;font-weight:700;}
  .map-hint{font-size:11.5px;color:#9FC4BD;margin:6px 0 0 0;}
  #liveMap{width:100%;height:auto;display:block;}

  /* ---- Main content ---- */
  .content{flex:1;padding:36px 44px 60px 44px;min-width:0;}
  .progress-bar{
    height:6px;background:var(--paper-3);border-radius:99px;overflow:hidden;margin-bottom:34px;
  }
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--teal));width:0%;transition:width .35s ease;}
  .step-content{min-height:60vh;}
  .step-content h2{font-size:26px;}
  .step-sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 28px 0;max-width:640px;}
  fieldset{border:none;padding:0;margin:0 0 26px 0;}
  .field{margin-bottom:22px;max-width:640px;}
  .field label.q{display:block;font-weight:600;font-size:14.5px;margin-bottom:8px;color:var(--ink);}
  .field .helptext{font-size:12.5px;color:var(--ink-soft);margin:-4px 0 8px 0;}
  input[type=text],input[type=email],textarea,select{
    width:100%;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:10px;
    padding:11px 13px;
    font-size:14.5px;
    font-family:inherit;
    color:var(--ink);
  }
  input[type=text]:focus,textarea:focus,select:focus{
    outline:2.5px solid var(--amber);outline-offset:1px;border-color:var(--amber);
  }
  textarea{min-height:78px;resize:vertical;}
  .option-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1.5px solid var(--line);
    background:#fff;
    padding:8px 14px;
    border-radius:99px;
    font-size:13.5px;
    cursor:pointer;
    user-select:none;
    color:var(--ink);
    transition:all .12s ease;
  }
  .chip input{position:absolute;opacity:0;width:0;height:0;}
  .chip.checked{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
  .radio-row{display:flex;gap:8px;}
  .radio-row .chip.checked{background:var(--amber);border-color:var(--amber);color:#3A2600;}
  .conditional{
    margin-top:12px;padding:14px 16px;background:var(--paper-2);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;
    display:none;
  }
  .conditional.show{display:block;}

  /* combobox (dropdown com busca) */
  .combo{position:relative;max-width:640px;}
  .combo-toggle{
    width:100%;display:flex;justify-content:space-between;align-items:center;
    border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;
    font-size:14.5px;color:var(--ink);cursor:pointer;text-align:left;font-family:inherit;
  }
  .combo-toggle:hover{border-color:var(--teal);}
  .combo-toggle[aria-expanded="true"]{border-color:var(--amber);outline:2.5px solid var(--amber);outline-offset:1px;}
  .combo-toggle-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .combo-caret{color:var(--ink-soft);font-size:11px;margin-left:8px;}
  .combo-panel{
    position:relative;margin-top:6px;background:#fff;border:1.5px solid var(--line);border-radius:10px;
    box-shadow:0 6px 18px rgba(28,43,40,.08);overflow:hidden;
  }
  .combo-search{
    width:100%;border:none;border-bottom:1.5px solid var(--line);padding:11px 13px;font-size:14px;
    font-family:inherit;border-radius:0;
  }
  .combo-search:focus{outline:none;border-bottom-color:var(--amber);}
  .combo-options{list-style:none;margin:0;padding:4px;max-height:220px;overflow-y:auto;}
  .combo-option{
    padding:9px 12px;border-radius:7px;font-size:13.5px;cursor:pointer;color:var(--ink);
  }
  .combo-option:hover{background:var(--paper-2);}
  .combo-option.selected{background:var(--teal-soft);font-weight:700;color:var(--teal-dark);}
  .combo-option.combo-freetext{color:var(--amber-dark);font-weight:600;border-top:1px dashed var(--line);margin-top:4px;padding-top:10px;}
  .combo-empty{padding:10px 12px;font-size:13px;color:var(--ink-soft);font-style:italic;}
  .combo-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .combo-tag{
    display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal-dark);
    padding:5px 6px 5px 12px;border-radius:99px;font-size:12.5px;font-weight:700;
  }
  .combo-tag-remove{
    background:rgba(10,62,59,.15);border:none;color:var(--teal-dark);width:18px;height:18px;border-radius:50%;
    cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .combo-tag-remove:hover{background:rgba(10,62,59,.3);}
  .combo-toggle-all{
    display:block;width:100%;text-align:left;background:var(--paper-2);border:none;border-bottom:1px solid var(--line);
    padding:8px 13px;font-size:12px;font-weight:700;color:var(--teal-dark);cursor:pointer;
  }
  .combo-toggle-all:hover{background:var(--teal-soft);}
  .add-answer-box{max-width:640px;margin:8px 0 2px;}
  .add-answer-open{padding:7px 10px;font-size:12.5px;}
  .add-answer-form{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:7px;}
  .add-answer-input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:13px;}
  .add-answer-save{padding:8px 12px;font-size:12.5px;}
  .add-answer-message{width:100%;margin:0;color:var(--ink-soft);font-size:12px;}

  /* Campo de CNPJ */
  .cnpj-field{max-width:400px;}
  .cnpj-input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;font-size:14.5px;font-family:inherit;color:var(--ink);}
  .cnpj-input:focus{outline:2.5px solid var(--amber);outline-offset:1px;border-color:var(--amber);}
  .cnpj-status{margin-top:8px;font-size:12.5px;border-radius:8px;padding:0;}
  .cnpj-status:empty{margin-top:0;}
  .cnpj-status-error{color:var(--danger);}
  .cnpj-status-loading{color:var(--ink-soft);font-style:italic;}
  .cnpj-status-warning{color:var(--amber-dark);}
  .cnpj-status-ok{background:var(--paper-2);border-left:3px solid var(--good);border-radius:0 8px 8px 0;padding:9px 12px;}
  .cnpj-status-line{line-height:1.4;}
  .cnpj-status-title{font-weight:700;color:var(--ink);}
  .cnpj-status-alert{color:var(--amber-dark);font-weight:600;margin-top:3px;}
  .cnpj-use-btn{margin-top:7px;background:var(--teal);color:#fff;border:none;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;}
  .cnpj-use-btn:hover{background:var(--teal-dark);}

  /* Doze Áreas de Necessidades Fundamentais */
  .area-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:680px;margin-top:4px;
  }
  .area-card{
    display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);
    border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .12s ease;
  }
  .area-card:hover{border-color:var(--teal);}
  .area-card.selected{border-color:var(--teal);background:var(--teal-soft);}
  .area-card:focus{outline:2.5px solid var(--amber);outline-offset:1px;}
  .area-num{
    flex:0 0 26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--serif);
  }
  .area-card.selected .area-num{background:var(--amber);color:#3A2600;}
  .area-nome{font-weight:700;font-size:13.5px;color:var(--teal-dark);margin-bottom:2px;}
  .area-card.selected .area-nome{color:var(--ink);}
  .area-desc{font-size:12px;color:var(--ink-soft);line-height:1.4;}
  .area-chips-compact{margin-top:2px;}
  .area-chips-compact .chip{font-size:12px;padding:6px 11px;}
  @media (max-width:640px){ .area-grid{grid-template-columns:1fr;} }

  /* Seletor agrupado por área (12 seções expansíveis com itens filhos) */
  .grouped-picker{max-width:640px;display:flex;flex-direction:column;gap:6px;}
  .grouped-section{border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;}
  .grouped-summary{
    list-style:none;display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;
    font-size:13.5px;font-weight:700;color:var(--teal-dark);user-select:none;
  }
  .grouped-summary::-webkit-details-marker{display:none;}
  .grouped-summary-num{
    width:20px;height:20px;border-radius:50%;background:var(--paper-2);color:var(--teal-dark);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-family:var(--serif);flex:0 0 20px;
  }
  .grouped-summary-count{
    margin-left:auto;background:var(--amber);color:#3A2600;border-radius:99px;padding:1px 8px;font-size:11px;
  }
  .grouped-body{padding:4px 14px 12px 14px;}
  .grouped-subtitle{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-soft);
    margin:10px 0 6px 0;
  }
  .grouped-subtitle:first-child{margin-top:2px;}
  .outro-chip{margin-top:2px;}
  .fornecedor-items-row{align-items:flex-start;}
  .fornecedor-item-cell{display:flex;flex-direction:column;gap:6px;}
  .inline-fornecedor-input{
    border:1.5px solid var(--amber);background:#fff;border-radius:8px;padding:7px 10px;
    font-size:13px;font-family:inherit;color:var(--ink);min-width:160px;
  }
  .inline-fornecedor-input:focus{outline:2px solid var(--amber);outline-offset:1px;}
  .inline-fornecedor-input::placeholder{color:var(--ink-soft);}
  .inline-fornecedor-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;margin-top:2px;}
  .grouped-picker-flat{max-width:640px;}
  .grouped-subtitle-standalone{
    background:var(--paper-2);padding:6px 10px;border-radius:7px;margin-top:12px;
  }
  .grouped-subtitle-standalone:first-child{margin-top:0;}
  .tipo-negocio-subgrupo{margin-top:14px;}

  /* dynamic entity cards */
  .entity-list{display:flex;flex-direction:column;gap:14px;margin:14px 0 8px 0;max-width:680px;}

  /* ---- Combobox: dropdown com busca ---- */
  .combo{position:relative;max-width:420px;}
  .combo summary{
    list-style:none;cursor:pointer;user-select:none;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    border:1.5px solid var(--line);background:#fff;border-radius:10px;
    padding:11px 13px;font-size:14.5px;color:var(--ink);
  }
  .combo summary::-webkit-details-marker{display:none;}
  .combo[open] summary{border-color:var(--amber);outline:2px solid var(--amber);outline-offset:1px;}
  .combo-summary-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .combo-chevron{color:var(--ink-soft);font-size:11px;flex:0 0 auto;}
  .combo-panel{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:40;
    background:#fff;border:1.5px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(28,43,40,.15);overflow:hidden;
  }
  .combo-search{
    width:100%;border:none;border-bottom:1.5px solid var(--line);border-radius:0;
    padding:11px 13px;font-size:14px;
  }
  .combo-search:focus{outline:none;border-bottom-color:var(--amber);}
  .combo-list{list-style:none;margin:0;padding:4px;max-height:230px;overflow-y:auto;}
  .combo-option{
    width:100%;text-align:left;background:none;border:none;padding:9px 10px;border-radius:7px;
    font-size:14px;cursor:pointer;color:var(--ink);
  }
  .combo-option:hover{background:var(--paper-2);}
  .combo-option.selected{background:var(--teal-soft);font-weight:700;color:var(--teal-dark);}
  .combo-empty,.combo-more{padding:9px 10px;font-size:12.5px;color:var(--ink-soft);font-style:italic;}

  .entity-card{
    background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;position:relative;
  }
  .entity-card .entity-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .entity-card .entity-head input[type=text]{font-weight:700;font-size:15px;border:none;border-bottom:1.5px dashed var(--line);border-radius:0;padding:4px 2px;}
  .entity-card .entity-head input[type=text]:focus{outline:none;border-bottom-color:var(--amber);}
  .remove-btn{
    background:none;border:none;color:var(--danger);font-size:12.5px;cursor:pointer;font-weight:600;
    padding:4px 8px;border-radius:6px;
  }
  .remove-btn:hover{background:#F6E4DE;}
  .entity-card .subfield{margin-bottom:10px;}
  .entity-card label.small{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:5px;}
  .rel-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
  .add-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--paper-2);border:1.5px dashed var(--teal);color:var(--teal-dark);
    padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .add-btn:hover{background:var(--teal-soft);}
  .empty-hint{font-size:13px;color:var(--ink-soft);font-style:italic;margin:6px 0 14px 0;}

  .nav-buttons{
    display:flex;justify-content:space-between;align-items:center;margin-top:40px;
    padding-top:24px;border-top:1px solid var(--line);
  }
  .btn{
    padding:12px 26px;border-radius:99px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-primary:disabled{background:#B9C9C5;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .btn-ghost:disabled{opacity:.35;cursor:not-allowed;}
  .error-msg{color:var(--danger);font-size:13px;margin-top:20px;display:none;}
  .error-msg.show{display:block;}

  /* apresentacao */
  .hero{max-width:620px;}
  .hero .bignum{font-family:var(--serif);font-size:15px;color:var(--amber-dark);font-weight:700;margin-bottom:10px;}
  .hero h2{font-size:32px;line-height:1.15;}
  .hero p{color:var(--ink-soft);font-size:15.5px;max-width:520px;}
  .hero-cards{display:flex;gap:14px;margin:26px 0 30px 0;flex-wrap:wrap;}
  .hero-card{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;flex:1;min-width:150px;}
  .hero-card .k{font-family:var(--serif);font-size:22px;color:var(--teal);}
  .hero-card .v{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

  /* review */
  .review-section{margin-bottom:28px;max-width:720px;}
  .review-section h3{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .review-row{display:flex;gap:14px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--paper-3);}
  .review-row .rk{flex:0 0 230px;color:var(--ink-soft);font-weight:600;}
  .review-row .rv{flex:1;}
  .tag-badge{
    display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin:2px 4px 2px 0;
  }
  .tag-cadeia{background:var(--teal-soft);color:var(--teal-dark);}
  .tag-complementar{background:var(--amber-soft);color:var(--amber-dark);}
  .tag-hibrida{background:linear-gradient(90deg,var(--teal-soft),var(--amber-soft));color:var(--ink);}
  .tag-indicacao{background:#E4E0F2;color:#4B3B8C;}
  .tag-parceria{background:#DDEFD9;color:var(--good);}
  .tag-oferta-produto{background:#E4DCC7;color:var(--ink);}
  .tag-oferta-servico{background:#DCE6E3;color:var(--teal-dark);}
  .export-row{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0;}
  .btn-outline{background:#fff;border:1.5px solid var(--teal);color:var(--teal-dark);padding:11px 20px;border-radius:99px;font-weight:700;font-size:13.5px;cursor:pointer;}
  .btn-outline:hover{background:var(--teal-soft);}
  pre.jsonpreview{
    background:var(--ink);color:#CFE3DF;padding:16px;border-radius:10px;font-size:11.5px;max-height:260px;overflow:auto;
    display:none;
  }
  .toggle-json{font-size:12.5px;color:var(--teal-dark);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-weight:700;}
  .success-box{
    background:var(--paper-2);border:1.5px solid var(--good);border-radius:var(--radius);padding:26px 28px;text-align:center;max-width:520px;
  }
  .success-box h2{color:var(--good);}

  /* Entrevista guiada: uma pergunta por tela, sem navegação por etapas ou jargão. */
  .rail-top,.steps,.map-label,.map-hint{display:none!important;}
  .app{max-width:1100px;min-height:100vh;align-items:stretch;}
  .rail{width:290px;flex:0 0 290px;justify-content:center;padding:24px 18px;}
  .map-wrap{margin:0;padding:0;border:0;position:sticky;top:20px;align-self:center;width:100%;}
  .content{padding-top:12vh;}
  .question-card{max-width:680px;min-height:45vh;display:flex;flex-direction:column;justify-content:center;}
  .question-card h2{font-size:clamp(25px,4vw,38px);line-height:1.2;margin-bottom:12px;}
  .question-card .question-help{font-size:15px;color:var(--ink-soft);margin:0 0 22px;}
  .question-card input,.question-card textarea{max-width:640px;}
  .question-count{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
  .nav-buttons{max-width:680px;margin-top:24px;padding-top:18px;}
  @media(max-width:860px){

/* ===== CNPJ: validação local (dígitos verificadores) + consulta pública à Receita Federal ===== */
// Algoritmo oficial de validação de CNPJ (módulo 11), roda 100% no navegador, sem dependência externa.
function validarCNPJ(cnpj){
  var s = String(cnpj||"").replace(/\D/g,"");
  if(s.length !== 14) return false;
  if(/^(\d)\1{13}$/.test(s)) return false; // todos os dígitos iguais
  function calcDigito(base, pesos){
    var soma = 0;
    for(var i=0;i<pesos.length;i++) soma += parseInt(base[i],10) * pesos[i];
    var resto = soma % 11;
    return resto < 2 ? 0 : 11 - resto;
  }
  var d1 = calcDigito(s.substring(0,12), [5,4,3,2,9,8,7,6,5,4,3,2]);
  if(d1 !== parseInt(s[12],10)) return false;
  var d2 = calcDigito(s.substring(0,13), [6,5,4,3,2,9,8,7,6,5,4,3,2]);
  if(d2 !== parseInt(s[13],10)) return false;
  return true;
}
function formatarCNPJ(cnpj){
  var s = String(cnpj||"").replace(/\D/g,"").slice(0,14);
  var p = [];
  if(s.length>0) p.push(s.substring(0,2));
  if(s.length>2) p[0] += "."+s.substring(2,5);
  if(s.length>5) p[0] += "."+s.substring(5,8);
  if(s.length>8) p[0] += "/"+s.substring(8,12);
  if(s.length>12) p[0] += "-"+s.substring(12,14);
  return p[0]||"";
}

function consultarCNPJPublico(cnpjDigits){
  return fetch("https://brasilapi.com.br/api/cnpj/v1/"+cnpjDigits)
    .then(function(r){
      if(!r.ok) throw new Error("CNPJ não encontrado na base pública (HTTP "+r.status+")");
      return r.json();
    })

      return {
        razaoSocial: d.razao_social || "",

        uf: d.uf || "",

      };
    });
}

// Preenche recursivamente qualquer campo ausente em "target" usando "defaults" como modelo.
// Objetos são mesclados campo a campo; arrays e valores primitivos só são substituídos se ausentes.
function deepMergeDefaults(target, defaults){
  if(Array.isArray(defaults)){
    return Array.isArray(target) ? target : defaults;
  }
  if(defaults && typeof defaults === "object"){
    if(!target || typeof target !== "object") target = {};
    for(var k in defaults){
      target[k] = deepMergeDefaults(target[k], defaults[k]);
    }
    return target;
  }
  return (target === undefined || target === null) ? defaults : target;
}

// Repara itens de listas repetíveis (fornecedores/clientes/complementares/ofertas) que foram
// salvos com uma versão anterior do formulário e podem não ter todos os campos atuais.
function backfillListItems(list, templateFn){
  if(!Array.isArray(list)) return [];
  return list.map(function(item){
    var template = templateFn();
    delete template.id; // preserva o id original do item já salvo
    return Object.assign(template, item);
  });
}

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    var fresh = freshState();
    parsed = deepMergeDefaults(parsed, fresh);

    if(parsed.fornecedores) parsed.fornecedores.lista = backfillListItems(parsed.fornecedores.lista, function(){ return newEntity("fornecedores"); });
    if(parsed.clientes) parsed.clientes.lista = backfillListItems(parsed.clientes.lista, function(){ return newEntity("clientes"); });
    if(parsed.complementares) parsed.complementares.lista = backfillListItems(parsed.complementares.lista, function(){ return newEntity("complementares"); });
    if(parsed.business) parsed.business.ofertas = backfillListItems(parsed.business.ofertas, newOferta);

    return parsed;
  }catch(e){ return null; }
}

/* ============================= HELPERS DE UI ============================= */
function h(tag, attrs, children){
  var node = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k==="class") node.className = attrs[k];
    else if(k==="html") node.innerHTML = attrs[k];
    else if(k.indexOf("on")===0) node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){
    if(c==null) return;
    if(typeof c === "string") node.appendChild(document.createTextNode(c));
    else node.appendChild(c);
  });
  return node;
}

function comboField(options, value, placeholder, onSelect, filterFn){
  var MAX_VISIBLE = 40;
  var showAll = false;
  var det = h("details",{class:"combo"});
  var summary = h("summary",{class:"combo-summary"});
  summary.appendChild(h("span",{class:"combo-summary-text"},[value ? value : placeholder]));
  summary.appendChild(h("span",{class:"combo-chevron", "aria-hidden":"true"},["▾"]));
  det.appendChild(summary);

  var panel = h("div",{class:"combo-panel"});
  var toggleAllBtn = null;
  if(filterFn){
    toggleAllBtn = h("button",{type:"button", class:"combo-toggle-all"});
    panel.appendChild(toggleAllBtn);
  }
  var searchInput = h("input",{type:"text", class:"combo-search", placeholder:"Digite para buscar..."});
  panel.appendChild(searchInput);
  var listEl = h("ul",{class:"combo-list"});
  panel.appendChild(listEl);
  det.appendChild(panel);

  function baseOptions(){
    if(filterFn && !showAll){
      var f = filterFn(options);
      return (f && f.length) ? f : options;
    }
    return options;
  }
  function updateToggleLabel(){
    if(!toggleAllBtn) return;
    var isFiltering = filterFn && !showAll && baseOptions().length < options.length;
    toggleAllBtn.textContent = showAll ? "Mostrar sugestões relevantes" : "Ver todas as opções ("+options.length+")";
    toggleAllBtn.style.display = (filterFn && (isFiltering || showAll)) ? "block" : "none";
  }
  function renderList(query){
    listEl.innerHTML = "";
    var norm = normalizeSearch(query);
    var base = baseOptions();
    var filtered = norm ? base.filter(function(o){ return normalizeSearch(o).indexOf(norm) > -1; }) : base;
    var capped = filtered.slice(0, MAX_VISIBLE);
    if(capped.length===0){
      listEl.appendChild(h("li",{class:"combo-empty"},["Nenhum resultado encontrado."]));
    }
    capped.forEach(function(opt){
      var li = h("li",{});
      var btn = h("button",{type:"button", class:"combo-option"+(opt===value?" selected":"")},[opt]);
      btn.addEventListener("click", function(){
        onSelect(opt);
        det.removeAttribute("open");
        renderCurrentStep();
      });
      li.appendChild(btn);
      listEl.appendChild(li);
    });
    if(filtered.length > MAX_VISIBLE){
      listEl.appendChild(h("li",{class:"combo-more"},["+"+(filtered.length-MAX_VISIBLE)+" resultados — continue digitando para refinar"]));
    }
    updateToggleLabel();
  }
  if(toggleAllBtn){
    toggleAllBtn.addEventListener("click", function(){ showAll = !showAll; renderList(searchInput.value); });
  }
  renderList("");
  searchInput.addEventListener("input", function(){ renderList(searchInput.value); });
  det.addEventListener("toggle", function(){
    if(det.open){
      searchInput.value = "";
      renderList("");
      setTimeout(function(){ searchInput.focus(); }, 20);
    }
  });
  return det;
}

// Seletor completo das 12 Áreas (cards com número, nome e descrição) — usado para a
// classificação do PRÓPRIO negócio, o campo mais estrutural do formulário.
// Campo de CNPJ auto-contido: máscara, validação de dígito verificador local, e consulta
// pública automática (BrasilAPI/Receita Federal) quando o número é válido.
// opts: {value, onDigitsChange(digits), dadosCache, onDadosChange(dados), onUseData(dados)}
function buildCNPJField(opts){
  var wrapper = h("div",{class:"cnpj-field"});
  var input = h("input",{type:"text", class:"cnpj-input", placeholder:"00.000.000/0000-00", inputmode:"numeric"});
  input.value = formatarCNPJ(opts.value||"");
  var statusEl = h("div",{class:"cnpj-status"});
  wrapper.appendChild(input);
  wrapper.appendChild(statusEl);

  var debounceTimer = null;

  function renderStatus(state, dados, digits){
    statusEl.innerHTML = "";
    statusEl.className = "cnpj-status";
    if(!digits || digits.length < 14) return;
    if(!validarCNPJ(digits)){
      statusEl.classList.add("cnpj-status-error");
      statusEl.textContent = "CNPJ inválido (dígito verificador não confere).";
      return;
    }
    if(state==="loading"){
      statusEl.classList.add("cnpj-status-loading");
      statusEl.textContent = "Consultando base pública da Receita Federal...";
      return;
    }
    if(state==="error"){
      statusEl.classList.add("cnpj-status-warning");
      statusEl.textContent = "CNPJ com dígitos válidos, mas não consegui consultar a base pública agora (sem internet ou serviço indisponível). Pode prosseguir normalmente.";
      return;
    }
    if(state==="ok" && dados){
      statusEl.classList.add("cnpj-status-ok");
      var linha1 = dados.razaoSocial + (dados.nomeFantasia && dados.nomeFantasia!==dados.razaoSocial ? ' ("'+dados.nomeFantasia+'")' : "");
      statusEl.appendChild(h("div",{class:"cnpj-status-line cnpj-status-title"},["✓ "+linha1]));
      statusEl.appendChild(h("div",{class:"cnpj-status-line"},[(dados.municipio||"?")+" - "+(dados.uf||"?")+(dados.situacao?" · "+dados.situacao:"")]));
      if(dados.situacao && dados.situacao.toUpperCase().indexOf("ATIVA")===-1){
        statusEl.appendChild(h("div",{class:"cnpj-status-line cnpj-status-alert"},["⚠ Situação cadastral diferente de ATIVA — confirme com a empresa."]));
      }
      if(opts.onUseData){
        var useBtn = h("button",{type:"button", class:"cnpj-use-btn"},["Usar nome e cidade encontrados"]);
        useBtn.addEventListener("click", function(){ opts.onUseData(dados); });
        statusEl.appendChild(useBtn);
      }
    }
  }

  input.addEventListener("input", function(){
    var caretWasAtEnd = input.selectionStart === input.value.length;
    input.value = formatarCNPJ(input.value);
    if(caretWasAtEnd) input.setSelectionRange(input.value.length, input.value.length);
    var digits = input.value.replace(/\D/g,"");
    opts.onDigitsChange(digits);
    clearTimeout(debounceTimer);
    if(digits.length===14 && validarCNPJ(digits)){
      renderStatus("loading", null, digits);
      debounceTimer = setTimeout(function(){
        consultarCNPJPublico(digits).then(function(dados){
          opts.onDadosChange(dados);
          renderStatus("ok", dados, digits);
        }).catch(function(){
          opts.onDadosChange(null);
          renderStatus("error", null, digits);
        });
      }, 500);
    } else {
      renderStatus(digits.length===14 ? "invalid" : null, null, digits);
    }
  });

  if(opts.value && opts.value.length===14){
    if(opts.dadosCache) renderStatus("ok", opts.dadosCache, opts.value);
    else if(validarCNPJ(opts.value)) renderStatus("error", null, opts.value); // já validado antes, sem cache: assume que a consulta não rodou/falhou
  }

  return wrapper;
}

// Seletor de múltipla escolha organizado em grupos: cada Área (das 12) aparece como uma
// seção expansível, com seus itens filhos como chips dentro. Usado para categorias que têm
// hierarquia clara com a arquitetura das 12 áreas (ex: insumos/compras de fornecedores).
// Seletor de múltipla escolha com poucos grupos-pai (ex: Presto serviço / Vendo produto),
// sempre visíveis (sem accordion, já que são só 2-3 grupos). Cada subitem pode aparecer em
// mais de um grupo (usando rótulos com contexto para evitar colisão de estado).
function parentFirstChipPicker(name, parents, subitensPorPai, selectedArr, onChange){
  var wrap = h("div",{class:"grouped-picker-flat"});

  wrap.appendChild(h("div",{class:"grouped-subtitle grouped-subtitle-standalone"},["Escolha uma ou as duas opções"]));
  var parentRow = h("div",{class:"option-row radio-row"});
  parents.forEach(function(parent){
    var checked = selectedArr.indexOf(parent) > -1;
    var id = name+"-parent-"+parent.replace(/[^a-zA-Z0-9]/g,"");
    var input = h("input",{type:"checkbox", id:id});
    input.checked = checked;
    var chip = h("label",{class:"chip"+(checked?" checked":""), for:id},[input, parent]);
    input.addEventListener("change", function(){
      var idx = selectedArr.indexOf(parent);
      if(input.checked && idx===-1) selectedArr.push(parent);
      if(!input.checked){
        if(idx>-1) selectedArr.splice(idx,1);
        // ao desmarcar o pai, remove também as subopções órfãs dele
        (subitensPorPai[parent]||[]).forEach(function(sub){
          var si = selectedArr.indexOf(sub);
          if(si>-1) selectedArr.splice(si,1);
        });
      }
      onChange();
      renderCurrentStep();
    });
    parentRow.appendChild(chip);
  });
  wrap.appendChild(parentRow);

  parents.forEach(function(parent){
    if(selectedArr.indexOf(parent) === -1) return; // subopções só aparecem depois de marcar o pai
    var subitens = subitensPorPai[parent] || [];
    if(subitens.length === 0) return;
    var box = h("div",{class:"conditional show tipo-negocio-subgrupo"});
    box.appendChild(h("div",{class:"grouped-subtitle"},["Dentro de \u201c"+parent+"\u201d, qual se aplica?"]));
    var subRow = h("div",{class:"option-row"});
    subitens.forEach(function(item){
      var checked = selectedArr.indexOf(item) > -1;
      var id = name+"-sub-"+item.replace(/[^a-zA-Z0-9]/g,"");
      var input = h("input",{type:"checkbox", id:id});
      input.checked = checked;
      var chip = h("label",{class:"chip"+(checked?" checked":""), for:id},[input, item]);
      input.addEventListener("change", function(){
        var idx = selectedArr.indexOf(item);
        if(input.checked && idx===-1) selectedArr.push(item);
        if(!input.checked && idx>-1) selectedArr.splice(idx,1);
        onChange();
        renderCurrentStep();
      });
      subRow.appendChild(chip);
    });
    box.appendChild(subRow);
    wrap.appendChild(box);
  });

  var outroChecked = selectedArr.indexOf("Outro") > -1;
  var outroId = name+"-Outro";
  var outroInput = h("input",{type:"checkbox", id:outroId});
  outroInput.checked = outroChecked;
  var outroChip = h("label",{class:"chip outro-chip"+(outroChecked?" checked":""), for:outroId},[outroInput, "Outro (não listado acima)"]);
  outroInput.addEventListener("change", function(){
    var idx = selectedArr.indexOf("Outro");
    if(outroInput.checked && idx===-1) selectedArr.push("Outro");
    if(!outroInput.checked && idx>-1) selectedArr.splice(idx,1);
    onChange();
    renderCurrentStep();
  });
  wrap.appendChild(outroChip);
  return wrap;
}

function groupedChipPickerFornecedorInline(name, gruposPorArea, lista, onChange){

  function entidadeDoItem(item){
    return lista.find(function(e){ return e.categorias && e.categorias.indexOf(item) > -1; });

      if(selectedCount>0) summary.appendChild(h("span",{class:"grouped-summary-count"},[String(selectedCount)]));
      det.appendChild(summary);
      var body = h("div",{class:"grouped-body"});

      function renderSubgrupo(tituloTipo, itens){
        if(!itens || itens.length===0) return;
        body.appendChild(h("div",{class:"grouped-subtitle"},[tituloTipo]));
        var subRow = h("div",{class:"option-row fornecedor-items-row"});
        itens.forEach(function(item){
          var entity = entidadeDoItem(item);
          var checked = !!entity;
          var cell = h("div",{class:"fornecedor-item-cell"});
          var id = name+"-"+item.replace(/[^a-zA-Z0-9]/g,"");
          var input = h("input",{type:"checkbox", id:id});
          input.checked = checked;
          var chip = h("label",{class:"chip"+(checked?" checked":""), for:id},[input, item]);
          input.addEventListener("change", function(){
            if(input.checked){
              var novaEntidade = newEntity("fornecedores");
              novaEntidade.categorias = [item];
              lista.push(novaEntidade);
            } else {
              var idx = lista.findIndex(function(e){ return e.categorias && e.categorias.indexOf(item)>-1; });
              if(idx>-1){
                var e = lista[idx];
                var ci = e.categorias.indexOf(item);
                e.categorias.splice(ci,1);
                if(e.categorias.length===0 && !e.empresa.trim() && !(e.itens||"").trim()){
                  lista.splice(idx,1); // remove o "placeholder" vazio, sem nome e sem outras categorias
                }
              }
            }
            onChange();
            renderCurrentStep();
          });
          cell.appendChild(chip);
          if(checked){
            var isOutro = CATEGORIA_INSUMO_TIPO[item] === "Outro";
            if(isOutro){
              cell.appendChild(h("span",{class:"inline-fornecedor-label"},["Produto ou serviço"]));

              itemNameInput.addEventListener("input", function(){ entity.itens = itemNameInput.value; onChange(); });
              itemNameInput.addEventListener("blur", function(){ renderCurrentStep(); });
              cell.appendChild(itemNameInput);
              cell.appendChild(h("span",{class:"inline-fornecedor-label"},["Fornecedor"]));
            }
            var nameInput = h("input",{type:"text", class:"inline-fornecedor-input", placeholder:"Nome do fornecedor..."});
            nameInput.value = entity.empresa;
            nameInput.addEventListener("input", function(){ entity.empresa = nameInput.value; onChange(); });
            nameInput.addEventListener("blur", function(){ renderCurrentStep(); });
            cell.appendChild(nameInput);
          }
          subRow.appendChild(cell);
        });
        body.appendChild(subRow);
      }
      renderSubgrupo("Produtos", grupo.produtos);
      renderSubgrupo("Serviços", grupo.servicos);
      renderSubgrupo("Outros", grupo.outros);

      det.appendChild(body);
      if(selectedCount>0) det.setAttribute("open","open");
      wrap.appendChild(det);
    });
  }

  render();
  return wrap;
}

function groupedChipPicker(name, gruposPorArea, selectedArr, onChange){
  var wrap = h("div",{class:"grouped-picker"});

  function render(){
    wrap.innerHTML = "";

    gruposPorArea.forEach(function(grupo){
      var areaInfo = AREAS_12.find(function(a){ return a.nome===grupo.area; });
      var todosItens = (grupo.produtos||[]).concat(grupo.servicos||[]);
      var selectedCount = todosItens.filter(function(it){ return selectedArr.indexOf(it)>-1; }).length;
      var det = h("details",{class:"grouped-section"});
      var summary = h("summary",{class:"grouped-summary"});
      summary.appendChild(h("span",{class:"grouped-summary-num"},[areaInfo ? String(areaInfo.num) : "?"]));
      summary.appendChild(h("span",{class:"grouped-summary-text"},[grupo.area]));
      if(selectedCount>0) summary.appendChild(h("span",{class:"grouped-summary-count"},[String(selectedCount)]));
      det.appendChild(summary);
      var body = h("div",{class:"grouped-body"});

      function renderSubgrupo(tituloTipo, itens){
        if(!itens || itens.length===0) return;
        body.appendChild(h("div",{class:"grouped-subtitle"},[tituloTipo]));
        var subRow = h("div",{class:"option-row"});
        itens.forEach(function(item){
          var checked = selectedArr.indexOf(item) > -1;
          var id = name+"-"+item.replace(/[^a-zA-Z0-9]/g,"");
          var input = h("input",{type:"checkbox", id:id});
          input.checked = checked;
          var chip = h("label",{class:"chip"+(checked?" checked":""), for:id},[input, item]);
          input.addEventListener("change", function(){
            var idx = selectedArr.indexOf(item);
            if(input.checked && idx===-1) selectedArr.push(item);
            if(!input.checked && idx>-1) selectedArr.splice(idx,1);
            onChange();
            renderCurrentStep();
          });
          subRow.appendChild(chip);
        });
        body.appendChild(subRow);
      }
      renderSubgrupo("Produtos", grupo.produtos);
      renderSubgrupo("Serviços", grupo.servicos);
      renderSubgrupo("Outros", grupo.outros);

      det.appendChild(body);
      if(selectedCount>0) det.setAttribute("open","open");
      wrap.appendChild(det);
    });

    renderOutroChip();
  }

  function renderOutroChip(){
    var outroChecked = selectedArr.indexOf("Outro") > -1;
    var outroId = name+"-Outro";
    var outroInput = h("input",{type:"checkbox", id:outroId});
    outroInput.checked = outroChecked;
    var outroChip = h("label",{class:"chip outro-chip"+(outroChecked?" checked":""), for:outroId},[outroInput, "Outro (não listado acima)"]);
    outroInput.addEventListener("change", function(){
      var idx = selectedArr.indexOf("Outro");
      if(outroInput.checked && idx===-1) selectedArr.push("Outro");
      if(!outroInput.checked && idx>-1) selectedArr.splice(idx,1);
      onChange();
      renderCurrentStep();
    });
    wrap.appendChild(outroChip);
  }

  render();
  return wrap;
}

/* ============================= COMBOBOX (dropdown com busca) ============================= */
function normalizeSearch(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

// Múltipla seleção com busca (para listas grandes, ex: segmentos de atuação). selectedArr é mutado diretamente (array de strings, referência do state).
// onChange() é chamado sem argumento após cada adição/remoção — o caller lê selectedArr direto do state.
function buildComboMulti(opts){
  var options = opts.options || [];
  var allowFreeText = opts.allowFreeText !== false;
  var selected = opts.selectedArr;
  var filterFn = opts.filterFn || null;
  var showAll = false;

  var wrapper = h("div",{class:"combo combo-multi"});
  var tagsRow = h("div",{class:"combo-tags"});
  var toggle = h("button",{type:"button", class:"combo-toggle", "aria-expanded":"false"});
  var toggleLabel = h("span",{class:"combo-toggle-label"});
  toggle.appendChild(toggleLabel);
  toggle.appendChild(h("span",{class:"combo-caret","aria-hidden":"true"},["▾"]));
  var panel = h("div",{class:"combo-panel"});
  panel.style.display = "none";
  var toggleAllBtn = null;
  if(filterFn){
    toggleAllBtn = h("button",{type:"button", class:"combo-toggle-all"});
    panel.appendChild(toggleAllBtn);
  }
  var searchInput = h("input",{type:"text", class:"combo-search", placeholder:"Digite para buscar..."});
  var list = h("ul",{class:"combo-options"});

  function baseOptions(){
    if(filterFn && !showAll){
      var f = filterFn(options);
      return (f && f.length) ? f : options;
    }
    return options;
  }
  function updateToggleLabel(){
    if(!toggleAllBtn) return;
    var isFiltering = filterFn && !showAll && baseOptions().length < options.length;
    toggleAllBtn.textContent = showAll ? "Mostrar sugestões relevantes" : "Ver todas as opções ("+options.length+")";
    toggleAllBtn.style.display = (filterFn && (isFiltering || showAll)) ? "block" : "none";
  }
  function refreshToggleLabel(){
    toggleLabel.textContent = selected.length
      ? (selected.length+" selecionado"+(selected.length>1?"s":""))
      : (opts.placeholder||"Selecionar...");
  }
  function refreshTags(){
    tagsRow.innerHTML = "";
    selected.forEach(function(v){
      var tag = h("span",{class:"combo-tag"},[v]);
      var rm = h("button",{type:"button", class:"combo-tag-remove", "aria-label":"Remover"},["×"]);
      rm.addEventListener("click", function(){
        var idx = selected.indexOf(v);
        if(idx>-1) selected.splice(idx,1);
        refreshTags(); refreshToggleLabel(); renderList(searchInput.value);
        opts.onChange();
      });
      tag.appendChild(rm);
      tagsRow.appendChild(tag);
    });
  }
  function toggleOption(o){
    var idx = selected.indexOf(o);
    if(idx>-1) selected.splice(idx,1); else selected.push(o);
    refreshTags(); refreshToggleLabel(); renderList(searchInput.value);
    opts.onChange();
  }
  function renderList(term){
    list.innerHTML = "";
    var norm = normalizeSearch(term);
    var base = baseOptions();
    var filtered = base.filter(function(o){ return normalizeSearch(o).indexOf(norm) > -1; });
    filtered.slice(0,80).forEach(function(o){
      var isSel = selected.indexOf(o) > -1;
      var li = h("li",{class:"combo-option"+(isSel?" selected":"")},[(isSel?"✓ ":"")+o]);
      li.addEventListener("mousedown", function(ev){ ev.preventDefault(); toggleOption(o); });
      list.appendChild(li);
    });
    if(allowFreeText && term && term.trim() && options.indexOf(term.trim())===-1 && selected.indexOf(term.trim())===-1){
      var liFree = h("li",{class:"combo-option combo-freetext"},['Adicionar "'+term.trim()+'"']);
      liFree.addEventListener("mousedown", function(ev){ ev.preventDefault(); toggleOption(term.trim()); searchInput.value=""; renderList(""); });
      list.appendChild(liFree);
    }
    updateToggleLabel();
  }
  if(toggleAllBtn){
    toggleAllBtn.addEventListener("click", function(){ showAll = !showAll; renderList(searchInput.value); });
  }
  function openPanel(){
    panel.style.display = "block";
    toggle.setAttribute("aria-expanded","true");
    searchInput.value = "";
    renderList("");
    setTimeout(function(){ searchInput.focus(); },0);
  }
  function closePanel(){
    panel.style.display = "none";
    toggle.setAttribute("aria-expanded","false");
  }

  toggle.addEventListener("click", function(){
    if(panel.style.display==="none") openPanel(); else closePanel();
  });
  searchInput.addEventListener("input", function(){ renderList(searchInput.value); });
  searchInput.addEventListener("blur", function(){ setTimeout(closePanel,150); });

  panel.appendChild(searchInput);
  panel.appendChild(list);
  refreshToggleLabel();
  refreshTags();
  wrapper.appendChild(tagsRow);
  wrapper.appendChild(toggle);
  wrapper.appendChild(panel);
  return wrapper;
}

// Helper: campo categorizado (chips OU combobox, conforme lista) + campo de detalhe opcional em texto livre.
function categorizedField(container, label, help, stateObj, catKey, detKey, options, placeholder, useCombo, chipName, filterFn){
  var selector = useCombo
    ? buildComboMulti({options:options, selectedArr:stateObj[catKey], placeholder:placeholder, onChange:function(){ saveState(); }, filterFn:filterFn})
    : chipGroup(chipName||catKey, options, stateObj[catKey], true, function(){ saveState(); });
  container.appendChild(fieldWrap(label, help, selector));
  container.appendChild(fieldWrap("Quer detalhar algo específico? (opcional)", "Preencha só se as opções acima não cobrirem exatamente o que você quer dizer.",
    textArea(stateObj[detKey], "", function(v){ stateObj[detKey]=v; saveState(); })));
}

    wrap.appendChild(card);

/* ============================= CLASSIFICAÇÃO ============================= */
function modeloNegocioLabel(b){
  if(!b.modeloNegocio) return "";
  if(b.modeloNegocio==="Outro") return b.modeloNegocioOutro || "Outro";
  return b.modeloNegocio + (b.modeloNegocioSubitem ? " — " + b.modeloNegocioSubitem : "");
}

function normName(n){ return (n||"").trim().toLowerCase(); }

function buildRelationships(){
  var map = {}; // normName -> record

  function ensure(name){
    var key = normName(name);
    if(!key) return null;
    if(!map[key]) map[key] = {
      empresa:name.trim(), fontes:[],
      cidade_empresa:"", pais_empresa:"", cnpj_empresa:"",
      cidade_negocio: state.business.cidade || "", pais_negocio: state.business.pais || "", cnpj_negocio: state.business.cnpj || "",
      area_propria: state.business.areaNecessidade || "", area_empresa:"", frequencia:"",
      compra_de:false, compra_de_mim:false, usa_minha_oferta:false,
      clientes_em_comum:false, indicacao:false, venda_conjunta:false, complementaridade:false
    };
    return map[key];
  }
  function aplicarComuns(r, e){
    if(e.cidade && e.cidade.trim()) r.cidade_empresa = e.cidade.trim();
    if(e.pais) r.pais_empresa = e.pais;
    if(e.cnpj && e.cnpj.length===14) r.cnpj_empresa = formatarCNPJ(e.cnpj);
    if(e.areaNecessidade) r.area_empresa = e.areaNecessidade;
    if(e.frequenciaRelacao) r.frequencia = e.frequenciaRelacao;
  }

  state.fornecedores.lista.forEach(function(e){
    var r = ensure(e.empresa); if(!r) return;
    r.fontes.push("fornecedor");
    aplicarComuns(r, e);
    r.compra_de = true; // por definição, é fornecedor
    if(e.compra_de_mim) r.compra_de_mim = true;
    if(e.clientes_em_comum) r.clientes_em_comum = true;
    if(e.indicacao) r.indicacao = true;
    if(e.venda_conjunta) r.venda_conjunta = true;
  });

  state.clientes.lista.forEach(function(e){
    var r = ensure(e.empresa); if(!r) return;
    r.fontes.push("cliente/revenda");
    aplicarComuns(r, e);
    r.compra_de_mim = true; // por definição
    if(e.usa_minha_oferta) r.usa_minha_oferta = true;
    if(e.clientes_em_comum) r.clientes_em_comum = true;
    if(e.indicacao) r.indicacao = true;
    if(e.venda_conjunta) r.venda_conjunta = true;
  });

  state.complementares.lista.forEach(function(e){
    var r = ensure(e.empresa); if(!r) return;
    r.fontes.push("complementar");
    aplicarComuns(r, e);
    r.complementaridade = true; // por definição, está na lista de complementares
    if(e.indico) r.indicacao = true;
    if(e.meIndica) r.indicacao = true;
    if(e.clientes_em_comum) r.clientes_em_comum = true;
    if(e.venda_conjunta) r.venda_conjunta = true;
    if(e.pacote_conjunto) r.venda_conjunta = true;
  });

  var list = Object.keys(map).map(function(k){ return map[k]; });
  list.forEach(function(r){
    var cadeia = r.compra_de || r.compra_de_mim || r.usa_minha_oferta;
    var complementar = r.clientes_em_comum || r.complementaridade;
    var classes = [];
    if(cadeia) classes.push("cadeia_produtiva");
    if(complementar) classes.push("rede_complementar");
    if(r.indicacao) classes.push("indicacao");
    if(r.venda_conjunta) classes.push("parceria");
    if(cadeia && complementar) classes.push("hibrida");
    r.classificacao = classes;
  });
  return list;
}

    "cnpj_negocio","cidade_negocio","pais_negocio","area_propria","modelo_negocio","segmento_negocio","tipo_negocio","produtos_servicos",
    "fontes","compra_de","compra_de_mim","usa_minha_oferta","clientes_em_comum","indicacao","venda_conjunta","complementaridade","classificacao"];
  var lines = [headers.join(";")];
  var modeloNegocio = modeloNegocioLabel(state.business);
  var segmentoNegocio = state.business.segmento==="Outro" ? (state.business.segmentoOutro||"Outro") : (state.business.segmento||"");
  var tipoNegocio = state.business.tipoNegocio.join("|")+(state.business.tipoNegocio.indexOf("Outro")>-1 && state.business.tipoNegocioOutro ? " ("+state.business.tipoNegocioOutro+")" : "");
  var produtosServicos = state.business.ofertas.map(function(o){ return (o.nome||"")+" ["+o.tipo+"]"; }).join("|");
  var cnpjNegocio = state.business.cnpj && state.business.cnpj.length===14 ? formatarCNPJ(state.business.cnpj) : "";
  rels.forEach(function(r){
    var row = [
      r.empresa, r.cnpj_empresa, r.cidade_empresa, r.pais_empresa, r.area_empresa, r.frequencia,
      cnpjNegocio, r.cidade_negocio, r.pais_negocio, r.area_propria, modeloNegocio, segmentoNegocio, tipoNegocio, produtosServicos,
      r.fontes.join("|"), r.compra_de, r.compra_de_mim, r.usa_minha_oferta,
      r.clientes_em_comum, r.indicacao, r.venda_conjunta, r.complementaridade, r.classificacao.join("|")
    ].map(function(v){
      var s = String(v==null?"":v);
      if(s.indexOf(";")>-1 || s.indexOf('"')>-1){ s = '"'+s.replace(/"/g,'""')+'"'; }
      return s;
    });
    lines.push(row.join(";"));
  });
  return lines.join("\n");
}

function sendToSheet(payload){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("COLE_AQUI_")===0){
    return Promise.reject(new Error("Configure a URL da implantação do Apps Script antes de enviar."));
  }
  // Google Apps Script Web Apps não retornam cabeçalhos CORS por padrão,
  // então usamos modo no-cors: o envio ocorre, mas não é possível ler a resposta.
  // Content-Type text/plain evita o preflight OPTIONS (que o Apps Script não trata).
  return fetch(APPS_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
}

function loadSharedOptions(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("COLE_AQUI_")===0) return;
  var callbackName="__mapaOptions_"+uid().replace(/[^a-zA-Z0-9_$]/g,"");
  var script=document.createElement("script");
  var finished=false;
  var timer=setTimeout(done,12000);
  function done(){
    if(finished)return;finished=true;clearTimeout(timer);
    try{delete window[callbackName];}catch(e){window[callbackName]=undefined;}
    if(script.parentNode)script.parentNode.removeChild(script);
  }
  window[callbackName]=function(response){
    if(!response||!response.ok||!response.options){done();return;}
    state.contributedOptions=state.contributedOptions||{};
    state.contributions=state.contributions||[];
    Object.keys(response.options).forEach(function(field){
      state.contributedOptions[field]=state.contributedOptions[field]||[];
      response.options[field].forEach(function(item){
        var value=typeof item==="string"?item:String(item.value||"");
        if(!value)return;
        if(!state.contributedOptions[field].some(function(saved){return normalizeSearch(saved)===normalizeSearch(value);})) state.contributedOptions[field].push(value);
        if(item&&item.area&&!state.contributions.some(function(saved){return saved.field===field&&normalizeSearch(saved.value)===normalizeSearch(value);})) state.contributions.push({field:field,value:value,area:item.area,shared:true});
        if(item&&item.area&&["produtosSelecionados","categoriasClientes","complementaresSelecionados","faltaLocalSelecionado","oportunidadeSelecionada"].indexOf(field)>-1) SEGMENTO_AREA[value]=item.area;
        if(item&&item.area&&field==="comprasSelecionadas") CATEGORIA_INSUMO_AREA[value]=item.area;
      });
    });
    saveState();renderCurrentStep();done();
  };
  script.onerror=done;
  script.src=APPS_SCRIPT_URL+(APPS_SCRIPT_URL.indexOf("?")>-1?"&":"?")+"callback="+encodeURIComponent(callbackName)+"&t="+Date.now();
  document.head.appendChild(script);
}

function downloadFile(filename, content, mime){
  var blob = new Blob([content], {type:mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function inferAreaFromText(value){
  var text = normalizeSearch(value);
  if(!text) return "";
  var learned=(state.contributions||[]).filter(function(item){return normalizeSearch(item.value)===text&&item.area;})[0];
  if(learned) return learned.area;
  var scores={}, best="", score=0;
  Object.keys(SEGMENTO_AREA).forEach(function(segment){
    var n=normalizeSearch(segment);
    if(n.length>4 && text.indexOf(n)>-1){ var area=SEGMENTO_AREA[segment]; scores[area]=(scores[area]||0)+n.length*3; }
  });
  var keywords={
    "Alimentos/Medicamentos":["comida","alimento","bebida","farinha","pao","bolo","remedio","medicamento","agro","hortifruti","carne"],
    "Transportes/Logísticas":["frete","entrega","transporte","combustivel","embalagem","estoque","veiculo","logistica"],
    "Habitações/Edificações":["obra","construcao","reforma","imovel","aluguel","moveis","pintura","arquitetura"],
    "Acompanhamentos/Assistências":["medico","saude","terapia","dentista","veterinario","psicologo","consulta"],
    "Saneamentos/Eliminações":["limpeza","higiene","residuo","lixo","saneamento","faxina"],
    "Educações/Pesquisas":["curso","aula","ensino","escola","treinamento","pesquisa"],
    "Informações/Comunicações":["internet","software","computador","publicidade","marketing","comunicacao","grafica"],
    "Entretenimentos/Lazeres":["turismo","evento","festa","hotel","esporte","lazer","musica"],
    "Políticas/Lideranças":["advogado","contabilidade","imposto","consultoria","gestao","financeiro","banco"],
    "Seguranças/Confortos":["seguranca","roupa","vestuario","beleza","estetica","seguro","conforto"],
    "Matérias-primas/Reciclagens":["materia prima","metal","madeira","reciclagem","maquina","quimico","reparo"],
    "Energias/Combustíveis":["energia","eletricidade","eletrica","gas","solar","combustivel"]
  };
  Object.keys(keywords).forEach(function(area){
    keywords[area].forEach(function(word){ if(text.indexOf(normalizeSearch(word))>-1) scores[area]=(scores[area]||0)+normalizeSearch(word).length; });
  });
  Object.keys(scores).forEach(function(area){if(scores[area]>score){best=area;score=scores[area];}});
  return best;
}

function splitNames(value){
  return String(value||"").split(/[\n,;]+/).map(function(x){return x.trim();}).filter(Boolean);
}
function reuseEntity(listType,name,id){
  var list=state[listType].lista||[];
  var old=list.filter(function(e){return normName(e.empresa)===normName(name);})[0];
  var entity=Object.assign(newEntity(listType),old||{});
  entity.id=old&&old.id ? old.id : id;
  entity.empresa=name;
  return entity;
}
function syncConversationAnswers(){
  var a=state.answers, b=state.business;
  b.nome=a.negocioNome.trim(); b.pais=a.pais||"Brasil"; b.cidade=a.cidade.trim();
  var selecionados=a.produtosSelecionados||[];
  b.produtoDetalhe=a.produtos.trim();
  b.segmento=selecionados[0]||"Outro"; b.segmentoOutro=a.produtos.trim();
  b.produtoCategorias=selecionados.slice();
  b.perfilClientes=Array.isArray(a.tipoClientes)?a.tipoClientes.slice():[];
  b.areaNecessidade=selecionados.map(function(s){return SEGMENTO_AREA[s]||inferAreaFromText(s);}).filter(Boolean)[0]||inferAreaFromText(a.produtos);
  a.produtosClassificados=selecionados.map(function(item){return {item:item,area:SEGMENTO_AREA[item]||inferAreaFromText(item)||"Não identificado automaticamente"};});
  if(a.produtos.trim()) a.produtosClassificados.push({item:a.produtos.trim(),area:inferAreaFromText(a.produtos)||"Não identificado automaticamente"});
  var area=b.areaNecessidade;
  if(!b.produtoCategorias.length && a.produtos.trim()) b.produtoCategorias=["Outro"];
  var compras=(a.comprasSelecionadas||[]).slice();
  var comprasTexto=compras.concat(a.comprasFornecedores?[a.comprasFornecedores]:[]).join(", ");
  state.fornecedores.lista=splitNames(a.fornecedores).map(function(name,i){
    var e=reuseEntity("fornecedores",name,"supplier"+i); if(comprasTexto) e.itens=comprasTexto;
    e.categorias=compras.slice();
    var inferred=compras.map(function(item){return CATEGORIA_INSUMO_AREA[item];}).filter(Boolean)[0]||inferAreaFromText(comprasTexto); if(inferred) e.areaNecessidade=inferred;
    e.compra_de=true; return e;
  });
  state.clientes.lista=splitNames(a.clientes).map(function(name,i){
    var e=reuseEntity("clientes",name,"customer"+i); if(a.usoOferta) e.comoUtiliza=a.usoOferta; e.categorias=(a.categoriasClientes||[]).slice(); e.usa_minha_oferta=true; return e;
  });
  var nomesComplementares=splitNames(a.complementares);
  var nomesIndicacao=splitNames(a.indicacoes);
  state.complementares.lista=nomesComplementares.map(function(name,i){
    var e=reuseEntity("complementares",name,"complementary"+i); e.clientes_em_comum=true; return e;
  });
  nomesIndicacao.forEach(function(name,i){
    var e=reuseEntity("complementares",name,"referral"+i); e.indico=true; e.meIndica=true;
    if(!state.complementares.lista.some(function(x){return normName(x.empresa)===normName(name);})) state.complementares.lista.push(e);
  });
  state.complementares.negociosQueClientesProcuramCategorias=(a.complementaresSelecionados||[]).slice();
  state.complementares.outrosProdutosClientesPrecisamDetalhe=a.complementares;
  state.complementares.indicaQuandoNaoTem=a.indicacoes ? "Sim" : "";
  state.complementares.jaFezVendaConjunta=a.vendaConjunta ? (normalizeSearch(a.vendaConjunta)==="nao" ? "Não" : "Sim") : "";
  state.oportunidades.buscaForaMunicipioCategorias=(a.faltaLocalSelecionado||[]).slice();
  state.oportunidades.parceirosDesejadosCategorias=(a.oportunidadeSelecionada||[]).slice();
}

function optionsWithContributions(key, options){
  var additions=(state.contributedOptions||{})[key]||[];
  return (options||[]).concat(additions.filter(function(value){return (options||[]).indexOf(value)===-1;}));
}
function addAnswerControl(key){
  var box=h("div",{class:"add-answer-box"});
  var open=h("button",{type:"button",class:"btn-outline add-answer-open"},["＋ Adicionar resposta"]);
  var form=h("div",{class:"add-answer-form"}); form.style.display="none";
  var input=h("input",{type:"text",class:"add-answer-input",placeholder:key.indexOf("cidade:")===0?"Digite o nome da cidade":"Digite uma opção que está faltando"});
  var save=h("button",{type:"button",class:"btn-primary add-answer-save"},["Salvar resposta"]);
  var message=h("p",{class:"add-answer-message"});
  open.addEventListener("click",function(){form.style.display="flex";open.style.display="none";input.focus();});
  save.addEventListener("click",function(){
    var value=input.value.trim();
    if(!value){message.textContent="Digite uma resposta.";return;}
    if(key.indexOf("cidade:")===0){
      var uf=key.slice(7);
      if(uf!=="*" && !/\s-\s[A-Z]{2}$/.test(value)) value += " - "+uf;
    }
    var options=optionsWithContributions(key,[]);
    if(options.some(function(item){return normalizeSearch(item)===normalizeSearch(value);})){message.textContent="Essa resposta já está na lista.";return;}
    state.contributedOptions=state.contributedOptions||{};
    state.contributedOptions[key]=state.contributedOptions[key]||[];
    state.contributedOptions[key].push(value);
    state.contributions=state.contributions||[];
    var contribution={id:uid(),field:key,value:value,createdAt:new Date().toISOString(),area:inferAreaFromText(value)||""};
    state.contributions.push(contribution);
    if(key==="produtosSelecionados"||key==="categoriasClientes"||key==="complementaresSelecionados"||key==="faltaLocalSelecionado"||key==="oportunidadeSelecionada"){
      if(contribution.area) SEGMENTO_AREA[value]=contribution.area;
    }
    if(key==="comprasSelecionadas"&&contribution.area) CATEGORIA_INSUMO_AREA[value]=contribution.area;
    if(key.indexOf("cidade:")===0) state.answers.cidade=value;
    else if(Array.isArray(state.answers[key])) state.answers[key].push(value);
    else if(Object.prototype.hasOwnProperty.call(state.answers,key)) state.answers[key]=value;
    syncConversationAnswers();
    saveState();
    renderCurrentStep();
  });
  form.appendChild(input);form.appendChild(save);form.appendChild(message);
  box.appendChild(open);box.appendChild(form);
  return box;
}

function renderConversation(container){
  syncConversationAnswers();
  var q=conversationQuestions[currentStepIndex];
  if(!q){ renderConversationReview(container); return; }
  container.appendChild(h("div",{class:"question-card"},[
    h("h2",{},[q.prompt]),
    q.help ? h("p",{class:"question-help"},[q.help]) : null,
    (function(){
      if(q.kind==="multi"){
        var multiOptions=optionsWithContributions(q.key,q.options);
        var multiField=buildComboMulti({options:multiOptions,selectedArr:state.answers[q.key],placeholder:"Escolha uma ou mais opções...",allowFreeText:false,onChange:function(){syncConversationAnswers();saveState();}});
        multiField.appendChild(addAnswerControl(q.key));
        return multiField;
      }
      if(q.kind==="dropdown"){
        var options=q.options;
        if(q.key==="estado" && state.answers.pais!=="Brasil") options=["Não se aplica"];
        options=optionsWithContributions(q.key,options);
        var dropdownWrap=h("div",{});
        dropdownWrap.appendChild(comboField(options,state.answers[q.key],q.placeholder||"Escolha uma opção...",function(v){
          state.answers[q.key]=v;
          if(q.key==="pais" && v!=="Brasil"){state.answers.estado="";state.answers.cidade="";}
          if(q.key==="estado") state.answers.cidade="";
          syncConversationAnswers();saveState();
        }));
        dropdownWrap.appendChild(addAnswerControl(q.key));
        return dropdownWrap;
      }
      if(q.kind==="city"){
        if(state.answers.pais!=="Brasil") return textInput(state.answers.cidade,"Digite o nome da cidade",function(v){state.answers.cidade=v;syncConversationAnswers();saveState();});
        var uf=String(state.answers.estado||"").slice(-2);
        var cityKey="cidade:"+(uf||"*");
        var cities=uf ? CIDADES_BRASIL.filter(function(city){return city.slice(-2)===uf;}) : CIDADES_BRASIL;
        cities=optionsWithContributions(cityKey,cities);
        var cityWrap=h("div",{});cityWrap.appendChild(comboField(cities,state.answers.cidade,q.placeholder,function(v){state.answers.cidade=v;syncConversationAnswers();saveState();}));cityWrap.appendChild(addAnswerControl(cityKey));return cityWrap;
      }
      return q.multiline ? textArea(state.answers[q.key],q.placeholder,function(v){state.answers[q.key]=v;syncConversationAnswers();saveState();}) : textInput(state.answers[q.key],q.placeholder,function(v){state.answers[q.key]=v;syncConversationAnswers();saveState();});
    })()
  ].filter(Boolean)));
}

var RENDERERS = {
  apresentacao: renderApresentacao,
  identificacao: renderIdentificacao,
  fornecedores: renderFornecedores,
  clientes: renderClientes,
  complementares: renderComplementares,
  oportunidades: renderOportunidades,
  revisao: renderRevisao
};

function validateCurrentStep(){
  var key = STEPS[currentStepIndex].key;
  var errorEl = document.getElementById("errorMsg");
  errorEl.classList.remove("show");
  if(key==="identificacao"){
    if(!state.business.nome.trim()){
      errorEl.textContent = "Por favor, informe o nome do negócio antes de continuar.";
      errorEl.classList.add("show");
      return false;
    }
    if(state.business.produtoCategorias.length===0 && !state.business.produtoDetalhe.trim()){
      errorEl.textContent = "Por favor, selecione ao menos um produto/serviço (ou descreva no campo de detalhe) antes de continuar.";
      errorEl.classList.add("show");
      return false;
    }
    if(!state.business.cidade.trim()){
      errorEl.textContent = "Por favor, informe a cidade onde o negócio está estabelecido antes de continuar.";
      errorEl.classList.add("show");
      return false;
    }
    if(!state.business.areaNecessidade){
      errorEl.textContent = "Por favor, selecione a Área de Necessidade Fundamental do seu negócio antes de continuar.";
      errorEl.classList.add("show");
      return false;
    }
  }
  return true;
}

function renderStepsList(){
  var ol = document.getElementById("stepsList");
  ol.innerHTML = "";
  STEPS.forEach(function(s, i){
    var li = h("li",{class: i===currentStepIndex ? "active" : (i<currentStepIndex ? "done" : "")});
    li.appendChild(h("span",{class:"num"},[i<currentStepIndex ? "✓" : String(i+1)]));
    li.appendChild(document.createTextNode(s.label));
    li.addEventListener("click", function(){
      if(i <= currentStepIndex || validateCurrentStep()){
        currentStepIndex = i; renderCurrentStep(true);
      }
    });
    ol.appendChild(li);
  });
}

function renderCurrentStep(isStepChange){
  // Guarda a posição de rolagem para restaurá-la quando NÃO for uma troca real de etapa
  // (ex: escolher uma opção num dropdown, marcar um chip, adicionar/remover um item).
  var scrollY = window.scrollY || window.pageYOffset;

  stepContentEl.innerHTML = "";
  var total=conversationQuestions.length+1;
  var isReview=currentStepIndex>=conversationQuestions.length;
  renderConversation(stepContentEl);
  document.getElementById("progressFill").style.width = (Math.min(currentStepIndex,total-1)/(total-1)*100)+"%";

  var backBtn = document.getElementById("btnBack");
  var nextBtn = document.getElementById("btnNext");
  backBtn.disabled = currentStepIndex===0;

  if(isReview){
    if(state.meta.sendStatus==="sending"){ nextBtn.textContent = "Enviando…"; nextBtn.disabled = true; }
    else if(state.meta.submittedAt){ nextBtn.textContent = "Enviado ✓"; nextBtn.disabled = true; }
    else if(state.meta.sendStatus==="error"){ nextBtn.textContent = "Tentar novamente"; nextBtn.disabled = false; }
    else { nextBtn.textContent = "Confirmar e enviar"; nextBtn.disabled = false; }
  } else {
    nextBtn.textContent = "Continuar";
    nextBtn.disabled = false;
  }
  document.getElementById("errorMsg").classList.remove("show");
  renderMap();

  if(isStepChange){
    window.scrollTo(0,0);
  } else {
    window.scrollTo(0, scrollY);
  }
}

document.getElementById("btnNext").addEventListener("click", function(){
  if(currentStepIndex>=conversationQuestions.length){
    if(state.meta.sendStatus==="sending") return;
    state.meta.sendStatus = "sending";
    state.meta.sendError = "";
    renderCurrentStep();
    var payload = buildExportObject();
    sendToSheet(payload).then(function(){
      state.meta.submittedAt = new Date().toISOString();
      state.meta.sendStatus = "ok";
      saveState();
      renderCurrentStep();
    }).catch(function(err){
      state.meta.sendStatus = "error";
      state.meta.sendError = "Não foi possível enviar automaticamente (sem internet ou bloqueio de rede). Baixe o JSON ou o CSV abaixo e envie manualmente, ou tente novamente.";
      saveState();
      renderCurrentStep();
    });
    return;
  }
  if(currentStepIndex < conversationQuestions.length){
    var requiredKey=conversationQuestions[currentStepIndex].key;
    var requiredMessage={negocioNome:"Digite o nome do seu negócio para continuar.",cidade:"Escolha ou digite a cidade onde seu negócio funciona para continuar."}[requiredKey];
    if(requiredKey==="estado" && state.answers.pais==="Brasil" && !state.answers.estado) requiredMessage="Escolha o estado onde seu negócio funciona para continuar.";
    if(requiredKey==="produtos" && !(state.answers.produtosSelecionados||[]).length && !String(state.answers.produtos||"").trim()) requiredMessage="Escolha ao menos uma opção ou descreva um produto ou serviço.";
    if(requiredMessage && !String(state.answers[requiredKey]||"").trim()){
      var errorEl=document.getElementById("errorMsg"); errorEl.textContent=requiredMessage; errorEl.classList.add("show"); return;
    }
    syncConversationAnswers();
    saveState();
    currentStepIndex++;
    renderCurrentStep(true);
  }
});
document.getElementById("btnBack").addEventListener("click", function(){
  if(currentStepIndex>0){ currentStepIndex--; renderCurrentStep(true); }
});

/* ============================= MAPA VIVO (SVG) ============================= */
function truncate(s, n){ s = s||""; return s.length>n ? s.slice(0,n-1)+"…" : s; }

function renderMap(){
  var svg = document.getElementById("liveMap");
  var W=260, H=460, cx=130, cy=230;
  var parts = [];

  function line(x1,y1,x2,y2,color,dashed){
    parts.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="1.4" '+(dashed?'stroke-dasharray="3,3"':'')+' opacity="0.8"/>');
  }
  function node(x,y,r,fill,stroke){
    parts.push('<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.2"/>');
  }
  function label(x,y,text,size,color,anchor){
    parts.push('<text x="'+x+'" y="'+y+'" font-size="'+size+'" fill="'+color+'" text-anchor="'+(anchor||"middle")+'" font-family="Arial, sans-serif">'+escapeXML(text)+'</text>');
  }
  function escapeXML(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  var suppliers = state.fornecedores.lista.filter(function(e){return e.empresa.trim();}).slice(0,5);
  var supMore = state.fornecedores.lista.filter(function(e){return e.empresa.trim();}).length - suppliers.length;
  var customers = state.clientes.lista.filter(function(e){return e.empresa.trim();}).slice(0,5);
  var custMore = state.clientes.lista.filter(function(e){return e.empresa.trim();}).length - customers.length;
  var comp = state.complementares.lista.filter(function(e){return e.empresa.trim();}).slice(0,4);
  var compMore = state.complementares.lista.filter(function(e){return e.empresa.trim();}).length - comp.length;

  // center node
  node(cx,cy,32,"#E1962F","#B87418");
  label(cx,cy+4,truncate(state.business.nome||"Seu negócio",12),11,"#3A2600");

  // suppliers (top)
  var topY0 = 40, topY1 = 150;
  suppliers.forEach(function(s,i){
    var y = suppliers.length>1 ? topY0 + (topY1-topY0)*(i/(suppliers.length-1)) : (topY0+topY1)/2;
    var x = 70 + (i%2)*120;
    line(x,y,cx,cy,"#CFE3DF",false);
    node(x,y,11,"#0E5450","#EFF6F3");
    label(x,y-16,truncate(s.empresa,10),9,"#0A3E3B");
  });
  if(suppliers.length===0){
    parts.push('<circle cx="130" cy="95" r="11" fill="none" stroke="#CFE3DF" stroke-width="1.2" stroke-dasharray="2,2"/>');
    label(130,99,"+","12","#CFE3DF");
  }
  if(supMore>0){ label(130,25,"+"+supMore+" fornecedores",9,"#CFE3DF"); }
  label(130,20,"Fornecedores",9,"#9FC4BD");

  // customers (bottom)
  var botY0 = 320, botY1 = 430;
  customers.forEach(function(c,i){
    var y = customers.length>1 ? botY0 + (botY1-botY0)*(i/(customers.length-1)) : (botY0+botY1)/2;
    var x = 70 + (i%2)*120;
    line(x,y,cx,cy,"#CFE3DF",false);
    node(x,y,11,"#0E5450","#EFF6F3");
    label(x,y+20,truncate(c.empresa,10),9,"#0A3E3B");
  });
  if(customers.length===0){
    parts.push('<circle cx="130" cy="375" r="11" fill="none" stroke="#CFE3DF" stroke-width="1.2" stroke-dasharray="2,2"/>');
    label(130,379,"+","12","#CFE3DF");
  }
  if(custMore>0){ label(130,452,"+"+custMore+" clientes",9,"#CFE3DF"); }
  label(130,448,"Clientes",9,"#9FC4BD");

  // complementares (sides, dashed amber)
  var sideY0 = 170, sideY1 = 300;
  comp.forEach(function(cItem,i){
    var y = comp.length>1 ? sideY0 + (sideY1-sideY0)*(i/(comp.length-1)) : (sideY0+sideY1)/2;
    var x = i%2===0 ? 26 : 234;
    line(x,y,cx,cy,"#E1962F",true);
    node(x,y,9,"#F6DFB6","#B87418");
    label(x, i%2===0? y-14 : y-14, truncate(cItem.empresa,9),8.5,"#B87418", i%2===0?"start":"end");
  });
  if(compMore>0){ label(130,240,"+"+compMore+" complementares",8.5,"#F6DFB6"); }

  svg.innerHTML = parts.join("");
}

/* ============================= INIT ============================= */
/* Fecha qualquer dropdown de busca aberto ao clicar fora dele — um único listener
   delegado, em vez de um por instância (evita acúmulo de listeners a cada re-render). */
document.addEventListener("click", function(evt){
  document.querySelectorAll("details.combo[open]").forEach(function(d){
    if(!d.contains(evt.target)) d.removeAttribute("open");
  });
});

renderCurrentStep(true);
loadSharedOptions();
})();
